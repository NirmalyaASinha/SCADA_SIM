<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NODE_ID}} - Operator Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --color-green: #00e676;
            --color-amber: #ffab00;
            --color-red: #ff1744;
            --color-grey: #37474f;
            --bg-void: #0a0a0f;
            --bg-panel: #0e1117;
            --bg-card: #141820;
            --border-normal: #1a2332;
            --text-primary: #c8d8e8;
            --text-secondary: #6b7a8d;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-void);
            color: var(--text-primary);
        }
        
        h1, h2, h3 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
        }
        
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-void) 0%, var(--bg-panel) 100%);
        }
        .login-card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-normal);
            min-width: 400px;
        }
        .login-card h1 {
            color: var(--color-green);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .login-card .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            background: var(--bg-void);
            border: 1px solid var(--border-normal);
            color: var(--text-primary);
            border-radius: 4px;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--color-green);
            color: var(--bg-void);
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
        }
        button:hover { background: #22c55e; }
        button:disabled { background: #374151; cursor: not-allowed; }
        
        .dashboard {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .header {
            background: var(--bg-panel);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-normal);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 2rem;
            align-items: center;
        }
        
        .header-left h1 {
            color: var(--color-green);
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        
        .header-left .node-type {
            display: inline-block;
            background: rgba(0, 230, 118, 0.15);
            color: var(--color-green);
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        
        .header-center {
            text-align: center;
        }
        
        .state-badge {
            display: inline-block;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .state-badge.ENERGIZED {
            background: rgba(0, 230, 118, 0.15);
            color: var(--color-green);
            border: 2px solid var(--color-green);
            animation: statePulse 2s ease-in-out infinite;
        }
        
        .state-badge.TRIPPED {
            background: rgba(255, 23, 68, 0.15);
            color: var(--color-red);
            border: 2px solid var(--color-red);
            animation: stateBlink 0.5s infinite;
        }
        
        .state-badge.DEENERGIZED {
            background: rgba(55, 71, 79, 0.15);
            color: var(--color-grey);
            border: 2px solid var(--color-grey);
        }
        
        .header-right {
            text-align: right;
        }
        
        .admin-conn {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .admin-conn .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 0.5rem;
        }
        
        .admin-conn .dot.online {
            background: var(--color-green);
            box-shadow: 0 0 8px var(--color-green);
        }
        
        .admin-conn .dot.offline {
            background: var(--color-red);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            padding: 1.5rem;
        }
        .card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-normal);
            position: relative;
            overflow: hidden;
        }
        .card h3 {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-green);
        }
        .value.flash {
            animation: valueFlash 0.3s;
        }
        .value.warning { color: var(--color-amber); }
        .value.critical { color: var(--color-red); }
        .unit {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .trend-arrow {
            display: inline-block;
            margin-left: 0.5rem;
            font-size: 1rem;
        }
        
        .control-panel {
            background: var(--bg-card);
            padding: 1.5rem;
            margin: 0 1.5rem 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-normal);
        }
        
        .breaker-control {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .breaker-btn {
            flex: 1;
            padding: 1.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Rajdhani', sans-serif;
            border: 2px solid;
        }
        
        .breaker-btn.close {
            background: rgba(0, 230, 118, 0.15);
            color: var(--color-green);
            border-color: var(--color-green);
        }
        
        .breaker-btn.close:hover {
            background: var(--color-green);
            color: var(--bg-void);
        }
        
        .breaker-btn.open {
            background: rgba(255, 23, 68, 0.15);
            color: var(--color-red);
            border-color: var(--color-red);
        }
        
        .breaker-btn.open:hover {
            background: var(--color-red);
            color: white;
        }
        
        .status-panel {
            background: var(--bg-card);
            padding: 1.5rem;
            margin: 0 1.5rem 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-normal);
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border-left: 3px solid transparent;
        }
        
        .status-row.energized {
            border-left-color: var(--color-green);
        }
        
        .status-row.offline {
            border-left-color: var(--color-red);
        }
        
        @keyframes valueFlash {
            0%, 100% { color: inherit; }
            50% { color: #ffffff; transform: scale(1.05); }
        }
        
        @keyframes statePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes stateBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .isolate-btn {
            background: rgba(255, 23, 68, 0.15);
            color: var(--color-red);
            border: 2px solid var(--color-red);
            margin-top: 0.5rem;
        }
        .isolate-btn:hover {
            background: var(--color-red);
            color: white;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }
        }
        .card {
            background: #151a26;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #2a3142;
        }
        .card h3 {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #4ade80;
        }
        .card .unit {
            color: #6b7280;
            font-size: 0.9rem;
        }
        .status-good { color: #4ade80; }
        .status-warning { color: #fbbf24; }
        .status-fault { color: #ef4444; }
        .control-panel {
            margin-top: 1rem;
            background: #151a26;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #2a3142;
        }
        .control-btn {
            padding: 0.5rem 1rem;
            margin: 0.5rem 0.5rem 0.5rem 0;
            width: auto;
        }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #4ade80; }
        .error { color: #ef4444; margin-top: 0.5rem; }
        .standby-btn {
            background: #f59e0b;
            color: #0a0e1a;
            padding: 0.5rem 1rem;
            margin: 0.5rem 0.5rem 0.5rem 0;
            width: auto;
        }
        .standby-btn:hover {
            background: #d97706;
        }
        .voltage-control-btn {
            padding: 0.5rem 0.75rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: inherit;
            margin: 0 0.25rem;
        }
        .voltage-control-btn:hover {
            background: #1d4ed8;
        }
        .voltage-display-text {
            color: #4ade80;
            font-size: 0.9rem;
            min-width: 60px;
            text-align: center;
            display: inline-block;
        }
        .password-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .password-modal-content {
            background: #151a26;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #2a3142;
            max-width: 500px;
            width: 90%;
        }
        .password-modal-content h2 {
            color: #4ade80;
            margin-bottom: 1rem;
        }
        .password-modal-content p {
            color: #9ca3af;
            margin-bottom: 1rem;
        }
        .password-modal-content input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            background: #0a0e1a;
            border: 1px solid #2a3142;
            color: #e0e0e0;
            border-radius: 4px;
            font-family: inherit;
        }
        .password-modal-buttons {
            display: flex;
            gap: 1rem;
        }
        .password-modal-buttons button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .password-modal-buttons .confirm-btn {
            background: #4ade80;
            color: #0a0e1a;
        }
        .password-modal-buttons .confirm-btn:hover {
            background: #22c55e;
        }
        .password-modal-buttons .cancel-btn {
            background: #6b7280;
            color: white;
        }
        .password-modal-buttons .cancel-btn:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API_BASE = window.location.origin;
        
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [token, setToken] = useState(null);
            const [nodeInfo, setNodeInfo] = useState({});
            const [telemetry, setTelemetry] = useState({});
            const [prevTelemetry, setPrevTelemetry] = useState({});
            const [flashingValues, setFlashingValues] = useState({});
            const [adminConnected, setAdminConnected] = useState(false);
            const [upstreamNodes, setUpstreamNodes] = useState([]);
            const [downstreamNodes, setDownstreamNodes] = useState([]);
            const [error, setError] = useState('');
            
            useEffect(() => {
                fetch(`${API_BASE}/`)
                    .then(r => r.json())
                    .then(data => {
                        setNodeInfo(data);
                        // Fetch topology info from admin
                        fetch('http://localhost:9000/nodes/map')
                            .then(r => r.json())
                            .then(map => {
                                const nodeId = data.node_id;
                                const topology = {
                                    'GEN-001': { upstream: [], downstream: ['SUB-001', 'SUB-002', 'SUB-003'] },
                                    'GEN-002': { upstream: [], downstream: ['SUB-001', 'SUB-002', 'SUB-003'] },
                                    'SUB-001': { upstream: ['GEN-001', 'GEN-002'], downstream: ['DIST-001'] },
                                    'SUB-002': { upstream: ['GEN-001', 'GEN-002'], downstream: ['DIST-002'] },
                                    'SUB-003': { upstream: ['GEN-001', 'GEN-002'], downstream: [] },
                                    'DIST-001': { upstream: ['SUB-001'], downstream: [] },
                                    'DIST-002': { upstream: ['SUB-002'], downstream: [] }
                                };
                                if (topology[nodeId]) {
                                    setUpstreamNodes(topology[nodeId].upstream);
                                    setDownstreamNodes(topology[nodeId].downstream);
                                }
                                setAdminConnected(true);
                            })
                            .catch(() => setAdminConnected(false));
                    });
            }, []);
            
            useEffect(() => {
                if (!isAuthenticated) return;
                
                const interval = setInterval(() => {
                    fetch(`${API_BASE}/telemetry`)
                        .then(r => r.json())
                        .then(data => {
                            // Detect value changes for flash animation
                            const newFlashing = {};
                            ['bus_voltage_kv', 'line_current_a', 'active_power_mw', 'frequency_hz'].forEach(key => {
                                if (prevTelemetry[key] !== data[key]) {
                                    newFlashing[key] = true;
                                }
                            });
                            if (Object.keys(newFlashing).length > 0) {
                                setFlashingValues(newFlashing);
                                setTimeout(() => setFlashingValues({}), 300);
                            }
                            setPrevTelemetry(data);
                            setTelemetry(data);
                        });
                }, 1000);
                
                const adminPing = setInterval(() => {
                    fetch('http://localhost:9000/grid/overview')
                        .then(() => setAdminConnected(true))
                        .catch(() => setAdminConnected(false));
                }, 5000);
                
                return () => {
                    clearInterval(interval);
                    clearInterval(adminPing);
                };
            }, [isAuthenticated, prevTelemetry]);
            
            const getTrend = (current, prev) => {
                if (!prev || !current) return '';
                const diff = current - prev;
                if (Math.abs(diff) < 0.01) return '→';
                return diff > 0 ? '↑' : '↓';
            };
            
            const getNodeType = () => {
                if (!nodeInfo.node_id) return '';
                if (nodeInfo.node_id.startsWith('GEN')) return 'GENERATION';
                if (nodeInfo.node_id.startsWith('SUB')) return 'TRANSMISSION';
                if (nodeInfo.node_id.startsWith('DIST')) return 'DISTRIBUTION';
                return '';
            };
            
            const getValueClass = (value, type) => {
                if (!value || value === 0) return 'critical';
                switch(type) {
                    case 'voltage':
                        if (value < 130 || value > 135) return 'warning';
                        return '';
                    case 'frequency':
                        if (value < 49.8 || value > 50.2) return 'warning';
                        if (value < 49.5 || value > 50.5) return 'critical';
                        return '';
                    case 'temp':
                        if (value > 80) return 'warning';
                        if (value > 90) return 'critical';
                        return '';
                    default:
                        return '';
                }
            };
            
            const handleLogin = async (username, password) => {
                try {
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        setToken(data.token);
                        setIsAuthenticated(true);
                        setError('');
                    } else {
                        setError(data.error || 'Login failed');
                    }
                } catch (e) {
                    setError('Connection error');
                }
            };
            
            const controlBreaker = async (action) => {
                const reason = prompt(`Reason for breaker ${action}:`);
                if (!reason) return;
                
                try {
                    const res = await fetch(`${API_BASE}/control/breaker`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ action, reason })
                    });
                    const data = await res.json();
                    if (!data.success) alert('Error: ' + (data.error || 'Failed'));
                } catch (e) {
                    alert('Control action failed');
                }
            };
            
            if (!isAuthenticated) {
                return <LoginScreen onLogin={handleLogin} nodeInfo={nodeInfo} error={error} />;
            }
            
            return <Dashboard 
                telemetry={telemetry} 
                nodeInfo={nodeInfo} 
                onControlBreaker={controlBreaker}
                token={token}
            />;
        }
        
        function LoginScreen({ onLogin, nodeInfo, error }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            
            return (
                <div className="login-screen">
                    <div className="login-card">
                        <h1>{nodeInfo.node_id || 'SCADA NODE'}</h1>
                        <div className="subtitle">{nodeInfo.node_type || 'Loading...'}</div>
                        <input 
                            type="text" 
                            placeholder="Username"
                            value={username}
                            onChange={e => setUsername(e.target.value)}
                        />
                        <input 
                            type="password" 
                            placeholder="Password"
                            value={password}
                            onChange={e => setPassword(e.target.value)}
                            onKeyPress={e => e.key === 'Enter' && onLogin(username, password)}
                        />
                        <button onClick={() => onLogin(username, password)}>LOGIN</button>
                        {error && <div className="error">{error}</div>}
                    </div>
                </div>
            );
        }
        
        function Dashboard({ telemetry, nodeInfo, onControlBreaker, token }) {
            const [isolateLoading, setIsolateLoading] = useState(false);
            const [standbyLoading, setStandbyLoading] = useState(false);
            const [voltageThresholds, setVoltageThresholds] = useState(null);
            const [passwordModal, setPasswordModal] = useState(null);
            const [modalPassword, setModalPassword] = useState('');
            const [voltageInput, setVoltageInput] = useState(0);
            const [nodeState, setNodeState] = useState(null);
            
            useEffect(() => {
                const fetchThresholds = async () => {
                    try {
                        const res = await fetch(`http://localhost:9000/nodes/${nodeInfo.node_id}/voltage/threshold`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        setVoltageThresholds(data);
                    } catch (e) {
                        console.error('Failed to fetch voltage thresholds:', e);
                    }
                };
                
                if (token && nodeInfo.node_id) {
                    fetchThresholds();
                }
            }, [token, nodeInfo]);
            
            useEffect(() => {
                const fetchNodeState = async () => {
                    try {
                        const res = await fetch(`http://localhost:9000/state`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        setNodeState(data);
                        // Update voltage input when state changes
                        setVoltageInput(data.current_voltage_kv || telemetry.bus_voltage_kv || 0);
                    } catch (e) {
                        console.error('Failed to fetch node state:', e);
                    }
                };
                
                if (token) {
                    fetchNodeState();
                    // Poll state every 1.5 seconds for real-time updates
                    const interval = setInterval(fetchNodeState, 1500);
                    return () => clearInterval(interval);
                }
            }, [token, telemetry]);
            
            const handleIsolateNode = async () => {
                if (!window.confirm(`⚠️ CRITICAL: Isolate this node (${nodeInfo.node_id})? This will immediately trip all breakers!`)) {
                    return;
                }
                
                setIsolateLoading(true);
                try {
                    const res = await fetch(`http://localhost:9000/nodes/${nodeInfo.node_id}/isolate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ reason: 'Operator Emergency Isolation', force: true })
                    });
                    const data = await res.json();
                    alert(`✅ ${data.message}`);
                } catch (e) {
                    alert('❌ Failed to isolate node: ' + e.message);
                } finally {
                    setIsolateLoading(false);
                }
            };
            
            const handleStandbyNode = async () => {
                if (!window.confirm(`Put this node on standby?`)) {
                    return;
                }
                
                setStandbyLoading(true);
                try {
                    const res = await fetch(`http://localhost:9000/nodes/${nodeInfo.node_id}/standby`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ reason: 'Operator Standby', duration_minutes: 60 })
                    });
                    const data = await res.json();
                    alert(`✅ Node is now on standby`);
                } catch (e) {
                    alert('❌ Failed to put node on standby: ' + e.message);
                } finally {
                    setStandbyLoading(false);
                }
            };
            
            const handleVoltageAdjust = async (newVoltage) => {
                if (!voltageThresholds) {
                    alert('Thresholds not loaded yet');
                    return;
                }
                
                if (newVoltage < voltageThresholds.min_voltage_kv || newVoltage > voltageThresholds.hard_max_voltage_kv) {
                    alert(`Voltage must be between ${voltageThresholds.min_voltage_kv} and ${voltageThresholds.hard_max_voltage_kv} kV`);
                    return;
                }
                
                // If above safe threshold, show password modal
                if (newVoltage > voltageThresholds.safe_max_voltage_kv) {
                    setPasswordModal({ 
                        newVoltage, 
                        safeMax: voltageThresholds.safe_max_voltage_kv 
                    });
                    return;
                }
                
                // Otherwise, proceed without password
                await submitVoltageAdjust(newVoltage, '');
            };
            
            const submitVoltageAdjust = async (newVoltage, password) => {
                try {
                    const res = await fetch(`http://localhost:9000/nodes/${nodeInfo.node_id}/voltage`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            voltage_kv: newVoltage, 
                            reason: 'Operator Adjustment',
                            password: password || ''
                        })
                    });
                    const data = await res.json();
                    
                    if (data.status === 'requires_password') {
                        setPasswordModal({
                            newVoltage,
                            safeMax: data.threshold
                        });
                        return;
                    }
                    
                    alert(`✅ Voltage adjusted to ${newVoltage} kV`);
                    setPasswordModal(null);
                    setModalPassword('');
                } catch (e) {
                    alert('❌ Failed to adjust voltage: ' + e.message);
                    setPasswordModal(null);
                    setModalPassword('');
                }
            };
            
            const handlePasswordSubmit = async () => {
                if (!passwordModal) return;
                
                await submitVoltageAdjust(passwordModal.newVoltage, modalPassword);
            };
            
            const getStatusClass = (value, nominal, threshold) => {
                if (!value) return '';
                const diff = Math.abs(value - nominal) / nominal;
                if (diff > threshold) return 'status-fault';
                if (diff > threshold / 2) return 'status-warning';
                return 'status-good';
            };
            
            return (
                <div className="dashboard">
                    <div className="header">
                        <div className="header-left">
                            <h1>{nodeInfo.node_id}</h1>
                            <span className="node-type">{getNodeType()}</span>
                        </div>
                        <div className="header-center">
                            <div className={`state-badge ${nodeState?.state || 'ENERGIZED'}`}>
                                {nodeState?.state || 'ENERGIZED'}
                            </div>
                        </div>
                        <div className="header-right">
                            <div className="admin-conn">
                                Admin: {adminConnected ? 'CONNECTED' : 'OFFLINE'}
                                <span className={`dot ${adminConnected ? 'online' : 'offline'}`}></span>
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid">
                        <div className="card">
                            <h3>BUS VOLTAGE</h3>
                            <div className={`value ${flashingValues.bus_voltage_kv ? 'flash' : ''} ${getValueClass(telemetry.bus_voltage_kv, 'voltage')}`}>
                                {telemetry.bus_voltage_kv?.toFixed(2) || '--'}
                                <span className="trend-arrow">{getTrend(telemetry.bus_voltage_kv, prevTelemetry.bus_voltage_kv)}</span>
                            </div>
                            <div className="unit">kV</div>
                        </div>
                        
                        <div className="card">
                            <h3>LINE CURRENT</h3>
                            <div className={`value ${flashingValues.line_current_a ? 'flash' : ''} ${getValueClass(telemetry.line_current_a, 'current')}`}>
                                {telemetry.line_current_a?.toFixed(1) || '--'}
                                <span className="trend-arrow">{getTrend(telemetry.line_current_a, prevTelemetry.line_current_a)}</span>
                            </div>
                            <div className="unit">A</div>
                        </div>
                        
                        <div className="card">
                            <h3>ACTIVE POWER</h3>
                            <div className={`value ${flashingValues.active_power_mw ? 'flash' : ''} ${getValueClass(telemetry.active_power_mw, 'power')}`}>
                                {telemetry.active_power_mw?.toFixed(1) || '--'}
                                <span className="trend-arrow">{getTrend(telemetry.active_power_mw, prevTelemetry.active_power_mw)}</span>
                            </div>
                            <div className="unit">MW</div>
                        </div>
                        
                        <div className="card">
                            <h3>FREQUENCY</h3>
                            <div className={`value ${flashingValues.frequency_hz ? 'flash' : ''} ${getValueClass(telemetry.frequency_hz, 'frequency')}`}>
                                {telemetry.frequency_hz?.toFixed(3) || '--'}
                                <span className="trend-arrow">{getTrend(telemetry.frequency_hz, prevTelemetry.frequency_hz)}</span>
                            </div>
                            <div className="unit">Hz</div>
                        </div>
                        
                        <div className="card">
                            <h3>POWER FACTOR</h3>
                            <div className="value">{telemetry.power_factor?.toFixed(3) || '--'}</div>
                            <div className="unit">-</div>
                        </div>
                        
                        {telemetry.transformer_temp_c !== undefined && (
                            <div className="card">
                                <h3>TRANSFORMER TEMP</h3>
                                <div className={`value ${getValueClass(telemetry.transformer_temp_c, 'temp')}`}>
                                    {telemetry.transformer_temp_c?.toFixed(1) || '--'}
                                </div>
                                <div className="unit">°C</div>
                            </div>
                        )}
                        
                        {telemetry.generator_rpm !== undefined && (
                            <div className="card">
                                <h3>GENERATOR RPM</h3>
                                <div className="value">{telemetry.generator_rpm || '--'}</div>
                                <div className="unit">RPM</div>
                            </div>
                        )}
                    </div>
                    
                    {upstreamNodes.length > 0 && (
                        <div className="status-panel">
                            <h3 style={{marginBottom: '1rem', color: 'var(--text-secondary)', fontSize: '0.85rem', textTransform: 'uppercase', letterSpacing: '0.08em'}}>
                                UPSTREAM POWER SOURCE
                            </h3>
                            {upstreamNodes.map(nodeId => (
                                <div key={nodeId} className="status-row energized">
                                    <div>
                                        <span style={{fontWeight: '700', color: 'var(--color-green)'}}>●</span>
                                        {' '}{nodeId}
                                    </div>
                                    <div style={{color: 'var(--color-green)'}}>
                                        ENERGIZED ✅
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    
                    {downstreamNodes.length > 0 && (
                        <div className="status-panel">
                            <h3 style={{marginBottom: '1rem', color: 'var(--text-secondary)', fontSize: '0.85rem', textTransform: 'uppercase', letterSpacing: '0.08em'}}>
                                DOWNSTREAM NODES (FED BY THIS NODE)
                            </h3>
                            {downstreamNodes.map(nodeId => (
                                <div key={nodeId} className="status-row energized">
                                    <div>
                                        <span style={{fontWeight: '700', color: 'var(--color-green)'}}>●</span>
                                        {' '}{nodeId}
                                    </div>
                                    <div style={{color: 'var(--color-green)'}}>
                                        ENERGIZED ✅
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    
                    <div className="control-panel">
                        <h3 style={{marginBottom: '1rem', color: 'var(--text-secondary)', fontSize: '0.85rem', textTransform: 'uppercase', letterSpacing: '0.08em'}}>
                            BREAKER CONTROL
                        </h3>
                        <p style={{marginBottom: '1rem', fontSize: '0.95rem'}}>
                            Current State: {telemetry.breaker_state ? '🟢 CLOSED' : '🔴 OPEN'}
                        </p>
                        <div className="breaker-control">
                            {telemetry.breaker_state ? (
                                <button className="breaker-btn open" onClick={() => onControlBreaker('open')}>
                                    OPEN BREAKER
                                </button>
                            ) : (
                                <button className="breaker-btn close" onClick={() => onControlBreaker('close')}>
                                    CLOSE BREAKER
                                </button>
                            )}
                        </div>
                        <button 
                            className="isolate-btn"
                            onClick={handleIsolateNode}
                            disabled={isolateLoading}
                            style={{width: '100%'}}
                        >
                            {isolateLoading ? '⏳ ISOLATING...' : '⚠️ ISOLATE NODE'}
                        </button>
                    </div>
                    
                    <div className="control-panel">
                        <h3>VOLTAGE CONTROL</h3>
                        <p>
                            <input 
                                type="number" 
                                placeholder="Enter voltage (kV)"
                                defaultValue={telemetry.bus_voltage_kv?.toFixed(2) || 0}
                                onChange={(e) => setVoltageInput(parseFloat(e.target.value))}
                                step="0.1"
                                style={{width: '150px', marginRight: '10px', padding: '8px', borderRadius: '4px', border: '1px solid #2a3142'}}
                            />
                            <button 
                                className="voltage-control-btn"
                                onClick={() => handleVoltageAdjust(voltageInput)}
                            >
                                SET VOLTAGE
                            </button>
                        </p>
                        <p style={{fontSize: '0.85rem', color: '#9ca3af'}}>
                            Current: {telemetry.bus_voltage_kv?.toFixed(2) || '--'} kV
                        </p>
                        {voltageThresholds && (
                            <p style={{fontSize: '0.85rem', color: '#9ca3af'}}>
                                Range: {voltageThresholds.min_voltage_kv} - {voltageThresholds.safe_max_voltage_kv} kV (safe) | Max: {voltageThresholds.hard_max_voltage_kv} kV
                            </p>
                        )}
                    </div>
                    
                    {passwordModal && (
                        <div className="password-modal">
                            <div className="password-modal-content">
                                <h2>⚠️ Voltage Threshold Override</h2>
                                <p>Requested voltage {passwordModal.newVoltage} kV exceeds safe threshold of {passwordModal.safeMax} kV</p>
                                <p>Enter your password to confirm this action:</p>
                                <input 
                                    type="password" 
                                    placeholder="Password"
                                    value={modalPassword}
                                    onChange={(e) => setModalPassword(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handlePasswordSubmit()}
                                />
                                <div className="password-modal-buttons">
                                    <button 
                                        className="confirm-btn"
                                        onClick={handlePasswordSubmit}
                                    >
                                        CONFIRM
                                    </button>
                                    <button 
                                        className="cancel-btn"
                                        onClick={() => {
                                            setPasswordModal(null);
                                            setModalPassword('');
                                        }}
                                    >
                                        CANCEL
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
