<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADA Admin - Operations Control Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        /* ===== DESIGN SYSTEM ===== */
        :root {
            /* Colors */
            --bg-void: #0a0a0f;
            --bg-panel: #0e1117;
            --bg-card: #141820;
            --border-normal: #1a2332;
            --text-primary: #c8d8e8;
            --text-mono: #c8d8e8;
            --text-secondary: #6b7a8d;
            
            --color-green: #00e676;
            --color-amber: #ffab00;
            --color-red: #ff1744;
            --color-blue: #0288d1;
            --color-purple: #aa44ff;
            --color-grey: #37474f;
            
            /* Typography */
            --font-display: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-weight-display-bold: 700;
            --font-size-display-lg: 2.2rem;
            --font-size-display-md: 1.8rem;
            --font-size-display-sm: 1.3rem;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: var(--font-mono);
            background: var(--bg-void);
            color: var(--text-primary);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: var(--font-weight-display-bold);
            color: var(--text-primary);
        }
        
        /* ===== LOGIN SCREEN ===== */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-void) 0%, var(--bg-panel) 100%);
        }
        
        .login-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-normal);
            min-width: 450px;
        }
        
        .login-card h1 {
            font-size: 2rem;
            color: var(--color-green);
            margin-bottom: 0.3rem;
            letter-spacing: 0.05em;
        }
        
        .login-card .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            letter-spacing: 0.02em;
        }
        
        input {
            width: 100%;
            padding: 0.875rem;
            margin-bottom: 1rem;
            background: var(--bg-void);
            border: 1px solid var(--border-normal);
            color: var(--text-primary);
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--color-blue);
            box-shadow: 0 0 12px rgba(2, 136, 209, 0.2);
        }
        
        button {
            width: 100%;
            padding: 0.875rem;
            background: var(--color-green);
            color: var(--bg-void);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 1rem;
            transition: all 0.25s;
            letter-spacing: 0.02em;
        }
        
        button:hover { 
            background: #22c55e;
            box-shadow: 0 8px 24px rgba(0, 230, 118, 0.2);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        /* ===== DASHBOARD LAYOUT ===== */
        .dashboard {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 220px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-normal);
            padding: 1.5rem 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 100vh;
        }
        
        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--color-green);
            padding: 0 1.5rem;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }
        
        .nav-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            border-left: 3px solid transparent;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        
        .nav-item:hover {
            background: rgba(0, 230, 118, 0.08);
            color: var(--color-green);
        }
        
        .nav-item.active {
            background: rgba(0, 230, 118, 0.12);
            color: var(--color-green);
            border-left-color: var(--color-green);
        }
        
        .nav-divider {
            height: 1px;
            background: var(--border-normal);
            margin: 1rem 1.5rem;
        }
        
        .nav-badge {
            display: inline-block;
            background: var(--color-amber);
            color: var(--bg-void);
            border-radius: 10px;
            padding: 0.1rem 0.5rem;
            font-size: 0.65rem;
            font-weight: 700;
            margin-left: 0.5rem;
        }
        
        .nav-badge.security {
            background: var(--color-purple);
            animation: badgePulse 2s ease-in-out infinite;
        }
        
        .user-panel {
            border-top: 1px solid var(--border-normal);
            padding: 1.5rem;
        }
        
        .user-panel .session-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        
        .user-panel button {
            width: 100%;
            margin-top: 1rem;
            padding: 0.5rem;
            background: rgba(255, 23, 68, 0.15);
            border: 1px solid var(--color-red);
            color: var(--color-red);
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        
        .user-panel button:hover {
            background: var(--color-red);
            color: white;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        /* Scan line effect */
        .main-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 230, 118, 0.015) 2px,
                rgba(0, 230, 118, 0.015) 4px
            );
            pointer-events: none;
            z-index: 1;
        }
        
        /* ===== HEADER ===== */
        .header {
            background: var(--bg-panel);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-normal);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .header h1 {
            font-size: 1.3rem;
            color: var(--text-primary);
        }
        
        .header-metrics {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }
        
        .header-metrics .metric {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header-metrics .metric-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .header-metrics .metric-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-green);
            margin-top: 0.25rem;
        }
        
        .header-metrics .separator {
            width: 1px;
            height: 30px;
            background: var(--border-normal);
            letter-spacing: 0.03em;
        }
        
        .frequency {
            font-size: var(--font-size-display-lg);
            font-weight: var(--font-weight-display-bold);
            color: var(--color-green);
            font-family: var(--font-mono);
        }
        
        /* ===== CONTENT AREA ===== */
        .content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }
        
        /* ===== KPI CARDS ===== */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .kpi-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-normal);
            transition: all 0.3s;
        }
        
        .kpi-card:hover {
            border-color: var(--color-blue);
            box-shadow: 0 4px 16px rgba(2, 136, 209, 0.1);
        }
        
        .kpi-card h3 {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        
        .kpi-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-green);
            font-family: var(--font-mono);
            margin-bottom: 0.25rem;
        }
        
        .kpi-card .unit {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: var(--font-mono);
        }
        
        /* ===== NODE GRID ===== */
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        
        .node-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-normal);
            transition: all 0.3s;
        }
        
        .node-card:hover {
            border-color: var(--color-blue);
            box-shadow: 0 4px 20px rgba(2, 136, 209, 0.15);
        }
        
        .node-card h3 {
            color: var(--color-green);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            font-family: var(--font-display);
            letter-spacing: 0.03em;
        }
        
        .node-card p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        
        /* ===== NODE STATUS BADGE ===== */
        .node-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .status-online { 
            background: rgba(0, 230, 118, 0.18);
            color: var(--color-green);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        
        .status-standby { 
            background: rgba(255, 171, 0, 0.18);
            color: var(--color-amber);
            border: 1px solid rgba(255, 171, 0, 0.3);
        }
        
        .status-offline { 
            background: rgba(255, 23, 68, 0.18);
            color: var(--color-red);
            border: 1px solid rgba(255, 23, 68, 0.3);
        }
        
        .status-energized {
            background: rgba(0, 230, 118, 0.18);
            color: var(--color-green);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        
        .status-tripped {
            background: rgba(255, 23, 68, 0.18);
            color: var(--color-red);
            border: 1px solid rgba(255, 23, 68, 0.3);
        }
        
        .status-deenergized {
            background: rgba(55, 71, 79, 0.18);
            color: var(--color-grey);
            border: 1px solid rgba(55, 71, 79, 0.3);
        }
        
        /* ===== ACTIONS ===== */
        .node-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .isolate-btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 23, 68, 0.15);
            color: var(--color-red);
            border: 1px solid var(--color-red);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            font-family: var(--font-display);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .isolate-btn:hover {
            background: var(--color-red);
            color: var(--bg-void);
            box-shadow: 0 4px 16px rgba(255, 23, 68, 0.3);
        }
        
        .standby-btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 171, 0, 0.15);
            color: var(--color-amber);
            border: 1px solid var(--color-amber);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            font-family: var(--font-display);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .standby-btn:hover {
            background: var(--color-amber);
            color: var(--bg-void);
            box-shadow: 0 4px 16px rgba(255, 171, 0, 0.3);
        }
        
        .start-btn {
            padding: 0.5rem 1rem;
            background: rgba(0, 230, 118, 0.15);
            color: var(--color-green);
            border: 1px solid var(--color-green);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            font-family: var(--font-display);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .start-btn:hover {
            background: var(--color-green);
            color: var(--bg-void);
            box-shadow: 0 4px 16px rgba(0, 230, 118, 0.3);
        }
        
        /* ===== VOLTAGE CONTROL ===== */
        .voltage-control {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            margin-left: auto;
        }
        
        .voltage-btn {
            padding: 0.4rem 0.8rem;
            background: rgba(2, 136, 209, 0.15);
            color: var(--color-blue);
            border: 1px solid var(--color-blue);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            font-family: var(--font-display);
            transition: all 0.2s;
        }
        
        .voltage-btn:hover {
            background: var(--color-blue);
            color: var(--bg-void);
            box-shadow: 0 4px 12px rgba(2, 136, 209, 0.3);
        }
        
        .voltage-display {
            color: var(--color-green);
            font-size: 0.85rem;
            min-width: 60px;
            text-align: center;
            font-family: var(--font-mono);
        }
        
        /* ===== NODE MAP ===== */
        .node-map {
            background: var(--bg-card);
            border: 1px solid var(--border-normal);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            min-height: 400px;
        }
        
        .node-map svg {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }
        
        .map-node {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .map-node:hover {
            opacity: 0.8;
        }
        
        .map-node-circle {
            stroke-width: 2;
            stroke: var(--border-normal);
        }
        
        .map-node-circle.online {
            fill: var(--color-green);
        }
        
        .map-node-circle.standby {
            fill: var(--color-amber);
        }
        
        .map-node-circle.isolated {
            fill: var(--color-purple);
        }
        
        .map-node-circle.tripped {
            fill: var(--color-red);
        }
        
        .map-node-circle.offline {
            fill: var(--color-grey);
        }
        
        /* ===== MODAL ===== */
        .password-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        
        .password-modal-content {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-normal);
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        
        .password-modal-content h2 {
            color: var(--color-amber);
            margin-bottom: 1rem;
            font-family: var(--font-display);
        }
        
        .password-modal-content p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .password-modal-content input {
            width: 100%;
            padding: 0.875rem;
            margin-bottom: 1rem;
            background: var(--bg-void);
            border: 1px solid var(--border-normal);
            color: var(--text-primary);
            border-radius: 6px;
            font-family: var(--font-mono);
        }
        
        .password-modal-buttons {
            display: flex;
            gap: 1rem;
        }
        
        .password-modal-buttons button {
            flex: 1;
            padding: 0.875rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-display);
            transition: all 0.2s;
        }
        
        .password-modal-buttons .confirm-btn {
            background: var(--color-green);
            color: var(--bg-void);
        }
        
        .password-modal-buttons .confirm-btn:hover {
            box-shadow: 0 4px 16px rgba(0, 230, 118, 0.3);
        }
        
        .password-modal-buttons .cancel-btn {
            background: var(--bg-panel);
            color: var(--text-secondary);
            border: 1px solid var(--border-normal);
        }
        
        .password-modal-buttons .cancel-btn:hover {
            background: var(--border-normal);
            color: var(--text-primary);
        }
        
        /* ===== UTILITIES ===== */
        .status-isolated {
            color: var(--color-purple);
            background: rgba(170, 68, 255, 0.18);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid rgba(170, 68, 255, 0.3);
        }
        
        .node-card.isolated {
            border-color: var(--color-purple);
            background: rgba(170, 68, 255, 0.05);
        }
        
        .error { 
            color: var(--color-red);
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        
        .voltage-input-container {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.5rem;
        }
        
        .voltage-input {
            width: 80px;
            padding: 0.5rem;
            background: var(--bg-void);
            border: 1px solid var(--border-normal);
            color: var(--text-primary);
            border-radius: 6px;
            font-family: var(--font-mono);
            text-align: center;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .voltage-input:focus {
            outline: none;
            border-color: var(--color-blue);
            box-shadow: 0 0 8px rgba(2, 136, 209, 0.2);
        }
        
        .voltage-input-btn {
            padding: 0.5rem 0.75rem;
            background: var(--color-green);
            color: var(--bg-void);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            font-family: var(--font-display);
            transition: all 0.2s;
        }
        
        .voltage-input-btn:hover {
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
        }
        
        /* ===== ANIMATIONS ===== */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .kpi-card, .node-card {
            animation: slideIn 0.3s ease-out;
        }
        
        .error {
            animation: shake 0.3s;
        }
        
        /* ===== ALARMS ===== */
        .alarm-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-normal);
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 2rem;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .alarm-row {
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 6px;
            position: relative;
            transition: all 0.3s;
        }
        
        .alarm-row.p1 {
            background: rgba(255, 23, 68, 0.08);
            border-left: 4px solid var(--color-red);
            animation: alarmBlink 1.5s infinite;
        }
        
        .alarm-row.p2 {
            background: rgba(255, 171, 0, 0.06);
            border-left: 3px solid var(--color-amber);
        }
        
        .alarm-row.p3 {
            background: rgba(255, 235, 59, 0.04);
            border-left: 2px solid #ffeb3b;
        }
        
        .alarm-row.p4,
        .alarm-row.p5 {
            border-left: 1px solid var(--border-normal);
        }
        
        .alarm-row.acknowledged {
            opacity: 0.5;
            animation: none;
            border-left-color: var(--border-normal);
        }
        
        .alarm-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }
        
        .alarm-row.p1 .alarm-dot {
            background: var(--color-red);
            animation: alarmBlink 1.5s infinite;
        }
        
        .alarm-row.p2 .alarm-dot {
            background: var(--color-amber);
        }
        
        .alarm-ack-btn {
            padding: 0.25rem 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-normal);
            border-radius: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.7rem;
            font-family: var(--font-display);
            transition: all 0.2s;
        }
        
        .alarm-ack-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        
        .alarm-mute-icon {
            cursor: pointer;
            font-size: 1rem;
            margin-left: auto;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        
        .alarm-mute-icon:hover {
            opacity: 1;
        }
        
        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }
        
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-normal);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            min-width: 300px;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: toastSlideIn 0.3s ease-out;
            pointer-events: auto;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .toast.p1 {
            background: rgba(255, 23, 68, 0.15);
            border-color: var(--color-red);
        }
        
        .toast.p2 {
            background: rgba(255, 171, 0, 0.15);
            border-color: var(--color-amber);
        }
        
        .toast.p3 {
            background: rgba(255, 235, 59, 0.1);
            border-color: #ffeb3b;
        }
        
        .toast-timer {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--color-green);
            animation: toastTimer linear;
        }
        
        /* ===== KPI ENHANCEMENTS ===== */
        .kpi-value-flash {
            animation: valueFlash 0.3s;
        }
        
        .data-freshness-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--color-green), var(--color-blue));
            animation: freshnessBar 2s linear infinite;
        }
        
        .kpi-sparkline {
            height: 30px;
            width: 100%;
            margin-top: 0.5rem;
        }
        
        .kpi-bar-chart {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-top: 0.5rem;
        }
        
        .kpi-bar-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
        }
        
        .kpi-bar {
            height: 4px;
            background: var(--color-green);
            border-radius: 2px;
            transition: width 0.3s;
        }
        
        /* ===== TOPOLOGY MAP EDGES ===== */
        .map-edge {
            stroke-width: 2;
            fill: none;
        }
        
        .map-edge.energized {
            stroke: var(--color-green);
            stroke-dasharray: 5 5;
            animation: flowAnimation 1s linear infinite;
        }
        
        .map-edge.deenergized {
            stroke: var(--border-normal);
            opacity: 0.3;
        }
        
        .map-edge.overloaded {
            stroke: var(--color-red);
            stroke-width: 3;
            stroke-dasharray: 5 5;
            animation: flowAnimation 0.5s linear infinite;
        }
        
        .map-node-label {
            font-size: 9px;
            fill: var(--text-secondary);
            font-family: var(--font-mono);
        }
        
        .map-node-overlay {
            font-size: 12px;
            font-weight: 700;
        }
        
        /* ===== ANIMATIONS ===== */
        @keyframes alarmBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes toastTimer {
            from { width: 100%; }
            to { width: 0%; }
        }
        
        @keyframes valueFlash {
            0%, 100% { color: inherit; }
            50% { color: #ffffff; transform: scale(1.05); }
        }
        
        @keyframes freshnessBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        @keyframes flowAnimation {
            to { stroke-dashoffset: -10; }
        }
        
        @keyframes badgePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }
        
        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @keyframes alarmBlink {
            0%, 100% { background: rgba(255, 23, 68, 0.2); }
            50% { background: rgba(255, 23, 68, 0.05); }
        }
        
        @keyframes securityPulse {
            0%, 100% { background: rgba(170, 68, 255, 0.1); }
            50% { background: rgba(170, 68, 255, 0.2); }
        }
        
        /* ===== ALARM ROW STYLES ===== */
        .alarm-row.p1 {
            animation: alarmBlink 1s infinite;
        }
        
        .security-alert {
            animation: securityPulse 2s infinite;
        }
        
        /* ===== STATUS BAR ===== */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 24px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-normal);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            font-size: 0.7rem;
            z-index: 1000;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .status-bar-center {
            color: var(--text-secondary);
        }
        
        .status-bar-right {
            display: flex;
            gap: 1rem;
            color: var(--text-secondary);
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-green);
        }
        
        .status-dot.error {
            background: var(--color-red);
            animation: statusBlink 0.5s infinite;
        }
        
        /* Corner brackets */
        .corner-brackets {
            position: relative;
        }
        
        .corner-brackets::before,
        .corner-brackets::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid var(--color-green);
            opacity: 0.3;
        }
        
        .corner-brackets::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }
        
        .corner-brackets::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }
        
        /* Node state strip */
        .node-state-strip {
            display: flex;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border-radius: 6px;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .node-state-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
        
        .node-state-item:hover {
            background: rgba(0, 230, 118, 0.1);
        }
        
        .node-state-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        /* Nav badges and dividers */
        .nav-divider {
            height: 1px;
            background: var(--border-normal);
            margin: 1rem 1.5rem;
        }
        
        .nav-badge {
            display: inline-block;
            background: var(--color-amber);
            color: var(--bg-void);
            border-radius: 10px;
            padding: 0.1rem 0.5rem;
            font-size: 0.65rem;
            font-weight: 700;
            margin-left: 0.5rem;
        }
        
        .nav-badge.security {
            background: var(--color-purple);
            animation: badgePulse 2s ease-in-out infinite;
        }
        
        /* User panel */
        .user-panel {
            border-top: 1px solid var(--border-normal);
            padding: 1.5rem;
        }
        
        .user-panel .session-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        
        .user-panel button {
            width: 100%;
            margin-top: 1rem;
            padding: 0.5rem;
            background: rgba(255, 23, 68, 0.15);
            border: 1px solid var(--color-red);
            color: var(--color-red);
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        
        .user-panel button:hover {
            background: var(--color-red);
            color: white;
        }
        
        /* Header metrics */
        .header-metrics {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }
        
        .header-metrics .metric {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header-metrics .metric-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .header-metrics .metric-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-green);
            margin-top: 0.25rem;
        }
        
        .header-metrics .separator {
            width: 1px;
            height: 30px;
            background: var(--border-normal);
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .nodes-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
            
            .kpi-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .dashboard {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-normal);
                max-height: 80px;
                flex-direction: row;
                padding: 0.75rem 0;
            }
            
            .sidebar h2 {
                padding: 0 1rem;
                margin-bottom: 0;
                white-space: nowrap;
            }
            
            .nav-item {
                display: inline-block;
                padding: 0.5rem 1rem;
                border-left: none;
                border-bottom: 3px solid transparent;
            }
            
            .nav-item.active {
                border-left: none;
                border-bottom-color: var(--color-green);
            }
            
            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: start;
            }
            
            .nodes-grid {
                grid-template-columns: 1fr;
            }
            
            .kpi-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API_BASE = 'http://localhost:9000';
        
        function App() {
            console.log('✓ App component initializing');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [token, setToken] = useState(null);
            const [user, setUser] = useState({});
            const [error, setError] = useState('');
            
            const handleLogin = async (username, password) => {
                try {
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        setToken(data.token);
                        setUser({ username: data.username, role: data.role });
                        setIsAuthenticated(true);
                        setError('');
                    } else {
                        setError(data.error || 'Login failed');
                    }
                } catch (e) {
                    setError('Connection error');
                }
            };
            
            if (!isAuthenticated) {
                return <LoginScreen onLogin={handleLogin} error={error} />;
            }
            
            return <Dashboard token={token} user={user} />;
        }
        
        function LoginScreen({ onLogin, error }) {
            console.log('✓ LoginScreen component rendering');
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                await onLogin(username, password);
                setIsLoading(false);
            };
            
            return (
                <div className="login-screen">
                    <div className="login-card">
                        <div style={{textAlign: 'center', marginBottom: '2rem'}}>
                            <div style={{
                                width: '64px', 
                                height: '64px', 
                                margin: '0 auto 1rem',
                                background: 'linear-gradient(135deg, var(--color-green), var(--color-blue))',
                                borderRadius: '12px',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                fontSize: '2rem',
                                boxShadow: '0 8px 24px rgba(0, 230, 118, 0.2)'
                            }}>
                                ⚡
                            </div>
                            <h1>SCADA ADMIN</h1>
                            <div className="subtitle">Operations Control Centre</div>
                        </div>
                        
                        <form onSubmit={handleSubmit}>
                            <input 
                                type="text" 
                                placeholder="Username"
                                value={username}
                                onChange={e => setUsername(e.target.value)}
                                disabled={isLoading}
                                required
                            />
                            <input 
                                type="password" 
                                placeholder="Password"
                                value={password}
                                onChange={e => setPassword(e.target.value)}
                                disabled={isLoading}
                                required
                            />
                            <button 
                                type="submit"
                                disabled={isLoading}
                                style={{opacity: isLoading ? 0.7 : 1, cursor: isLoading ? 'wait' : 'pointer'}}
                            >
                                {isLoading ? '⏳ AUTHENTICATING...' : 'LOGIN'}
                            </button>
                        </form>
                        
                        {error && (
                            <div className="error" style={{textAlign: 'center', animation: 'shake 0.3s'}}>
                                ❌ {error}
                            </div>
                        )}
                        
                        <div style={{marginTop: '1.5rem', paddingTop: '1.5rem', borderTop: '1px solid var(--border-normal)', fontSize: '0.75rem', color: 'var(--text-secondary)', textAlign: 'center'}}>
                            Test Accounts: admin / admin@scada2024 | engineer / eng@scada2024
                        </div>
                    </div>
                </div>
            );
        }
        
        function Dashboard({ token, user }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [overview, setOverview] = useState({});
            const [nodes, setNodes] = useState([]);
            const [alarms, setAlarms] = useState([]);
            const [toasts, setToasts] = useState([]);
            const [prevOverview, setPrevOverview] = useState({});
            const [securityEvents, setSecurityEvents] = useState([]);
            const [modbusTransactions, setModbusTransactions] = useState([]);
            const [sessionTime, setSessionTime] = useState(0);
            const [lastDataReceived, setLastDataReceived] = useState(0);
            
            // Count unacknowledged alarms
            const unacknowledgedAlarms = alarms.filter(a => !a.acknowledged).length;
            
            // Count security events (unknown connections)
            const unknownConnections = securityEvents.filter(e => e.type === 'unknown_connection' && e.status === 'active').length;
            
            // Add toast notification
            const addToast = (alarm) => {
                const newToast = {
                    id: Date.now(),
                    alarm,
                    duration: alarm.priority === 'P1' ? 10000 : alarm.priority === 'P2' ? 6000 : 3000
                };
                setToasts(prev => [...prev.slice(-2), newToast]); // Keep max 3
                
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== newToast.id));
                }, newToast.duration);
            };
            
            // Remove toast
            const removeToast = (id) => {
                setToasts(prev => prev.filter(t => t.id !== id));
            };
            
            useEffect(() => {
                const fetchOverview = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/grid/overview`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        
                        // Check for value changes to trigger flash
                        if (prevOverview.total_generation_mw !== data.total_generation_mw ||
                            prevOverview.total_load_mw !== data.total_load_mw) {
                            // Trigger flash animation
                        }
                        
                        setPrevOverview(data);
                        setOverview(data);
                    } catch (e) {
                        console.error('Failed to fetch overview:', e);
                    }
                };
                
                const fetchNodes = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/nodes`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        setNodes(data);
                    } catch (e) {
                        console.error('Failed to fetch nodes:', e);
                    }
                };
                
                const fetchAlarms = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/alarms`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        if (Array.isArray(data)) {
                            setAlarms(data);
                        }
                    } catch (e) {
                        console.error('Failed to fetch alarms:', e);
                    }
                };
                
                fetchOverview();
                fetchNodes();
                fetchAlarms();
                
                const interval = setInterval(() => {
                    fetchOverview();
                    fetchNodes();
                    fetchAlarms();
                    setLastDataReceived(0);
                }, 3000);
                
                // Session timer
                const sessionTimer = setInterval(() => {
                    setSessionTime(prev => prev + 1);
                }, 1000);
                
                // Last data received timer
                const dataTimer = setInterval(() => {
                    setLastDataReceived(prev => prev + 0.1);
                }, 100);
                
                // WebSocket for real-time alarms
                const ws = new WebSocket(`ws://localhost:9001`);
                ws.onopen = () => console.log('WebSocket connected');
                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'alarm_raised') {
                            const newAlarm = msg.alarm;
                            setAlarms(prev => [newAlarm, ...prev]);
                            addToast(newAlarm);
                        }
                        if (msg.type === 'unknown_connection') {
                            setSecurityEvents(prev => [msg.event, ...prev]);
                        }
                    } catch (e) {
                        console.error('WebSocket message error:', e);
                    }
                };
                
                return () => {
                    clearInterval(interval);
                    clearInterval(sessionTimer);
                    clearInterval(dataTimer);
                    ws.close();
                };
            }, [token]);
            
            // Acknowledge alarm
            const acknowledgeAlarm = async (alarmId) => {
                try {
                    await fetch(`${API_BASE}/alarms/${alarmId}/ack`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ user: user.username })
                    });
                    
                    setAlarms(prev => prev.map(a => 
                        a.id === alarmId ? { ...a, acknowledged: true, acked_by: user.username, acked_at: new Date() } : a
                    ));
                } catch (e) {
                    console.error('Failed to acknowledge alarm:', e);
                }
            };
            
            return (
                <div className="dashboard">
                    {/* Toast notifications */}
                    <div className="toast-container">
                        {toasts.map(toast => (
                            <div 
                                key={toast.id}
                                className={`toast p${toast.alarm.priority?.charAt(1) || '3'}`}
                                onClick={() => removeToast(toast.id)}
                            >
                                <div style={{display: 'flex', alignItems: 'center', gap: '0.75rem'}}>
                                    <div style={{fontSize: '1.5rem'}}>
                                        {toast.alarm.priority === 'P1' ? '🚨' : toast.alarm.priority === 'P2' ? '⚠️' : 'ℹ️'}
                                    </div>
                                    <div style={{flex: 1}}>
                                        <div style={{fontWeight: 600, fontSize: '0.9rem', marginBottom: '0.25rem'}}>
                                            {toast.alarm.node_id || 'System'}
                                        </div>
                                        <div style={{fontSize: '0.8rem', color: 'var(--text-secondary)'}}>
                                            {toast.alarm.message}
                                        </div>
                                    </div>
                                </div>
                                <div className="toast-timer" style={{animationDuration: `${toast.duration}ms`}}></div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="sidebar">
                        <div style={{padding: '0 1.5rem', marginBottom: '2rem', borderBottom: '1px solid var(--border-normal)', paddingBottom: '1.5rem'}}>
                            <h2 style={{marginBottom: '0.5rem'}}>SCADA OCC</h2>
                            <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', letterSpacing: '0.02em'}}>Control Centre v2.0</div>
                        </div>
                        
                        <div style={{flex: 1, overflowY: 'auto'}}>
                            <div 
                                className={`nav-item ${activeTab === 'overview' ? 'active' : ''}`}
                                onClick={() => setActiveTab('overview')}
                            >
                                ⬡ Grid Overview
                            </div>
                            <div 
                                className={`nav-item ${activeTab === 'nodes' ? 'active' : ''}`}
                                onClick={() => setActiveTab('nodes')}
                            >
                                ⊞ Node Management
                            </div>
                            
                            <div className="nav-divider"></div>
                            
                            <div 
                                className={`nav-item ${activeTab === 'control' ? 'active' : ''}`}
                                onClick={() => setActiveTab('control')}
                            >
                                ⚙ Control Center
                            </div>
                            <div 
                                className={`nav-item ${activeTab === 'alarms' ? 'active' : ''}`}
                                onClick={() => setActiveTab('alarms')}
                            >
                                🔔 Alarms
                                {unacknowledgedAlarms > 0 && (
                                    <span className="nav-badge">{unacknowledgedAlarms}</span>
                                )}
                            </div>
                            <div 
                                className={`nav-item ${activeTab === 'security' ? 'active' : ''}`}
                                onClick={() => setActiveTab('security')}
                            >
                                🛡 Security
                                {unknownConnections > 0 && (
                                    <span className="nav-badge security">{unknownConnections}</span>
                                )}
                            </div>
                            <div 
                                className={`nav-item ${activeTab === 'historian' ? 'active' : ''}`}
                                onClick={() => setActiveTab('historian')}
                            >
                                📊 Historian
                            </div>
                            
                            <div className="nav-divider"></div>
                            
                            <div 
                                className={`nav-item ${activeTab === 'modbus' ? 'active' : ''}`}
                                onClick={() => setActiveTab('modbus')}
                            >
                                📡 Modbus Monitor
                            </div>
                            <div 
                                className={`nav-item ${activeTab === 'audit' ? 'active' : ''}`}
                                onClick={() => setActiveTab('audit')}
                            >
                                📋 Audit Log
                            </div>
                            
                            <div className="nav-divider"></div>
                            
                            <div 
                                className={`nav-item ${activeTab === 'settings' ? 'active' : ''}`}
                                onClick={() => setActiveTab('settings')}
                            >
                                ⚙ Settings
                            </div>
                        </div>
                        
                        <div className="user-panel">
                            <div style={{fontSize: '0.65rem', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '0.5rem'}}>
                                Logged in as
                            </div>
                            <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.25rem'}}>
                                <div style={{width: '24px', height: '24px', borderRadius: '50%', background: 'linear-gradient(135deg, var(--color-green), var(--color-blue))', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.7rem'}}>
                                    👤
                                </div>
                                <div style={{color: 'var(--color-green)', fontWeight: 600, fontSize: '0.9rem'}}>{user.username}</div>
                            </div>
