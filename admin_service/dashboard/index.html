<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADA Admin - Operations Control Centre</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            background: #0a0e1a;
            color: #e0e0e0;
        }
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
        }
        .login-card {
            background: #151a26;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid #2a3142;
            min-width: 450px;
        }
        .login-card h1 {
            color: #4ade80;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            font-weight: 700;
        }
        .login-card .subtitle {
            color: #9ca3af;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        input {
            width: 100%;
            padding: 0.875rem;
            margin-bottom: 1rem;
            background: #0a0e1a;
            border: 1px solid #2a3142;
            color: #e0e0e0;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 0.875rem;
            background: #4ade80;
            color: #0a0e1a;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
        }
        button:hover { background: #22c55e; }
        .dashboard {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #151a26;
            border-right: 2px solid #2a3142;
            padding: 1.5rem 0;
        }
        .sidebar h2 {
            color: #4ade80;
            font-size: 1.2rem;
            padding: 0 1.5rem;
            margin-bottom: 2rem;
        }
        .nav-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            color: #9ca3af;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            background: #0a0e1a;
            color: #4ade80;
        }
        .nav-item.active {
            background: #0a0e1a;
            color: #4ade80;
            border-left-color: #4ade80;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
        }
        .header {
            background: #151a26;
            padding: 1rem 2rem;
            border-bottom: 2px solid #4ade80;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #4ade80;
            font-size: 1.3rem;
        }
        .frequency {
            font-size: 2.2rem;
            font-weight: 700;
            color: #4ade80;
        }
        .content {
            padding: 2rem;
        }
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .kpi-card {
            background: #151a26;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #2a3142;
        }
        .kpi-card h3 {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .kpi-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #4ade80;
        }
        .kpi-card .unit {
            color: #6b7280;
            font-size: 0.9rem;
        }
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        .node-card {
            background: #151a26;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #2a3142;
        }
        .node-card h3 {
            color: #4ade80;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .node-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-online { background: #065f46; color: #4ade80; }
        .status-offline { background: #7f1d1d; color: #ef4444; }
        .error { color: #ef4444; margin-top: 0.5rem; }
        .node-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .isolate-btn {
            padding: 0.5rem 1rem;
            background: #ea580c;
            color: white;
            border: 2px solid #dc2626;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .isolate-btn:hover {
            background: #dc2626;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }
        .voltage-control {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            margin-left: auto;
        }
        .voltage-btn {
            padding: 0.3rem 0.6rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .voltage-btn:hover {
            background: #1d4ed8;
        }
        .voltage-display {
            color: #4ade80;
            font-size: 0.9rem;
            min-width: 60px;
            text-align: center;
        }
        .standby-btn {
            padding: 0.4rem 0.8rem;
            background: #f59e0b;
            color: #0a0e1a;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: inherit;
            margin-left: 0.5rem;
        }
        .standby-btn:hover {
            background: #d97706;
        }
        .start-btn {
            padding: 0.4rem 0.8rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: inherit;
            margin-left: 0.5rem;
        }
        .start-btn:hover {
            background: #059669;
        }
        .node-map {
            background: #151a26;
            border: 1px solid #2a3142;
            border-radius: 6px;
            padding: 2rem;
            margin-bottom: 2rem;
            min-height: 400px;
        }
        .node-map svg {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }
        .map-node {
            cursor: pointer;
        }
        .map-node-circle {
            stroke-width: 2;
        }
        .map-node-circle.online {
            fill: #10b981;
        }
        .map-node-circle.standby {
            fill: #f59e0b;
        }
        .map-node-circle.isolated {
            fill: #ef4444;
        }
        .password-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .password-modal-content {
            background: #151a26;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #2a3142;
            max-width: 500px;
            width: 90%;
        }
        .password-modal-content h2 {
            color: #4ade80;
            margin-bottom: 1rem;
        }
        .password-modal-content p {
            color: #9ca3af;
            margin-bottom: 1rem;
        }
        .password-modal-content input {
            width: 100%;
            padding: 0.875rem;
            margin-bottom: 1rem;
            background: #0a0e1a;
            border: 1px solid #2a3142;
            color: #e0e0e0;
            border-radius: 4px;
            font-family: inherit;
        }
        .password-modal-buttons {
            display: flex;
            gap: 1rem;
        }
        .password-modal-buttons button {
            flex: 1;
            padding: 0.875rem;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .password-modal-buttons .confirm-btn {
            background: #4ade80;
            color: #0a0e1a;
        }
        .password-modal-buttons .confirm-btn:hover {
            background: #22c55e;
        }
        .password-modal-buttons .cancel-btn {
            background: #6b7280;
            color: white;
        }
        .password-modal-buttons .cancel-btn:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API_BASE = 'http://localhost:9000';
        
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [token, setToken] = useState(null);
            const [user, setUser] = useState({});
            const [error, setError] = useState('');
            
            const handleLogin = async (username, password) => {
                try {
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        setToken(data.token);
                        setUser({ username: data.username, role: data.role });
                        setIsAuthenticated(true);
                        setError('');
                    } else {
                        setError(data.error || 'Login failed');
                    }
                } catch (e) {
                    setError('Connection error');
                }
            };
            
            if (!isAuthenticated) {
                return <LoginScreen onLogin={handleLogin} error={error} />;
            }
            
            return <Dashboard token={token} user={user} />;
        }
        
        function LoginScreen({ onLogin, error }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            
            return (
                <div className="login-screen">
                    <div className="login-card">
                        <h1>SCADA ADMIN</h1>
                        <div className="subtitle">Operations Control Centre</div>
                        <input 
                            type="text" 
                            placeholder="Username"
                            value={username}
                            onChange={e => setUsername(e.target.value)}
                        />
                        <input 
                            type="password" 
                            placeholder="Password"
                            value={password}
                            onChange={e => setPassword(e.target.value)}
                            onKeyPress={e => e.key === 'Enter' && onLogin(username, password)}
                        />
                        <button onClick={() => onLogin(username, password)}>LOGIN</button>
                        {error && <div className="error">{error}</div>}
                    </div>
                </div>
            );
        }
        
        function Dashboard({ token, user }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [overview, setOverview] = useState({});
            const [nodes, setNodes] = useState([]);
            
            useEffect(() => {
                const fetchOverview = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/grid/overview`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        setOverview(data);
                    } catch (e) {
                        console.error('Failed to fetch overview:', e);
                    }
                };
                
                const fetchNodes = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/nodes`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        setNodes(data);
                    } catch (e) {
                        console.error('Failed to fetch nodes:', e);
                    }
                };
                
                fetchOverview();
                fetchNodes();
                
                const interval = setInterval(() => {
                    fetchOverview();
                    fetchNodes();
                }, 3000);
                
                return () => clearInterval(interval);
            }, [token]);
            
            return (
                <div className="dashboard">
                    <div className="sidebar">
                        <h2>SCADA OCC</h2>
                        <div 
                            className={`nav-item ${activeTab === 'overview' ? 'active' : ''}`}
                            onClick={() => setActiveTab('overview')}
                        >
                            Grid Overview
                        </div>
                        <div 
                            className={`nav-item ${activeTab === 'nodes' ? 'active' : ''}`}
                            onClick={() => setActiveTab('nodes')}
                        >
                            Node Management
                        </div>
                    </div>
                    
                    <div className="main-content">
                        <div className="header">
                            <h1>GRID OVERVIEW</h1>
                            <div className="frequency">
                                {overview.grid_frequency_hz?.toFixed(3) || '--'} Hz
                            </div>
                        </div>
                        
                        <div className="content">
                            {activeTab === 'overview' && <OverviewTab overview={overview} />}
                            {activeTab === 'nodes' && <NodesTab nodes={nodes} token={token} />}
                        </div>
                    </div>
                </div>
            );
        }
        
        function OverviewTab({ overview }) {
            return (
                <>
                    <div className="kpi-row">
                        <div className="kpi-card">
                            <h3>TOTAL GENERATION</h3>
                            <div className="value">{overview.total_generation_mw?.toFixed(1) || '0'}</div>
                            <div className="unit">MW</div>
                        </div>
                        
                        <div className="kpi-card">
                            <h3>TOTAL LOAD</h3>
                            <div className="value">{overview.total_load_mw?.toFixed(1) || '0'}</div>
                            <div className="unit">MW</div>
                        </div>
                        
                        <div className="kpi-card">
                            <h3>GRID LOSSES</h3>
                            <div className="value">{overview.grid_losses_mw?.toFixed(1) || '0'}</div>
                            <div className="unit">MW ({overview.loss_percentage?.toFixed(1) || '0'}%)</div>
                        </div>
                        
                        <div className="kpi-card">
                            <h3>NODES ONLINE</h3>
                            <div className="value">{overview.nodes_online || 0}/{overview.nodes_total || 0}</div>
                            <div className="unit">nodes</div>
                        </div>
                    </div>
                </>
            );
        }
        
        function NodesTab({ nodes, token }) {
            const [isolateLoading, setIsolateLoading] = useState({});
            const [standbyLoading, setStandbyLoading] = useState({});
            const [startLoading, setStartLoading] = useState({});
            const [nodeMap, setNodeMap] = useState({});
            const [passwordModal, setPasswordModal] = useState(null);
            const [modalPassword, setModalPassword] = useState('');
            const [nodeThresholds, setNodeThresholds] = useState({});
            
            useEffect(() => {
                const fetchNodeMap = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/nodes/map`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        setNodeMap(data);
                    } catch (e) {
                        console.error('Failed to fetch node map:', e);
                    }
                };
                
                const fetchThresholds = async () => {
                    const thresholds = {};
                    for (const node of nodes) {
                        try {
                            const res = await fetch(`${API_BASE}/nodes/${node.node_id}/voltage/threshold`, {
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            const data = await res.json();
                            thresholds[node.node_id] = data;
                        } catch (e) {
                            console.error(`Failed to fetch threshold for ${node.node_id}:`, e);
                        }
                    }
                    setNodeThresholds(thresholds);
                };
                
                fetchNodeMap();
                if (nodes.length > 0) {
                    fetchThresholds();
                }
            }, [nodes, token]);
            
            const handleIsolateNode = async (nodeId) => {
                if (!window.confirm(`⚠️ CRITICAL: Isolate node ${nodeId}? This will immediately trip all breakers!`)) {
                    return;
                }
                
                setIsolateLoading(prev => ({ ...prev, [nodeId]: true }));
                try {
                    const res = await fetch(`${API_BASE}/nodes/${nodeId}/isolate`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ reason: 'Admin Isolation', force: true })
                    });
                    const data = await res.json();
                    alert(`✅ ${data.message}`);
                } catch (e) {
                    alert('❌ Failed to isolate node: ' + e.message);
                } finally {
                    setIsolateLoading(prev => ({ ...prev, [nodeId]: false }));
                }
            };
            
            const handleStandbyNode = async (nodeId) => {
                if (!window.confirm(`Put node ${nodeId} on standby?`)) {
                    return;
                }
                
                setStandbyLoading(prev => ({ ...prev, [nodeId]: true }));
                try {
                    const res = await fetch(`${API_BASE}/nodes/${nodeId}/standby`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ reason: 'Admin Standby', duration_minutes: 60 })
                    });
                    const data = await res.json();
                    alert(`✅ Node ${nodeId} is now on standby`);
                } catch (e) {
                    alert('❌ Failed to put node on standby: ' + e.message);
                } finally {
                    setStandbyLoading(prev => ({ ...prev, [nodeId]: false }));
                }
            };
            
            const handleStartNode = async (nodeId) => {
                if (!window.confirm(`Start node ${nodeId} from standby?`)) {
                    return;
                }
                
                setStartLoading(prev => ({ ...prev, [nodeId]: true }));
                try {
                    const res = await fetch(`${API_BASE}/nodes/${nodeId}/start`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ reason: 'Admin Start' })
                    });
                    const data = await res.json();
                    alert(`✅ Node ${nodeId} is back online`);
                } catch (e) {
                    alert('❌ Failed to start node: ' + e.message);
                } finally {
                    setStartLoading(prev => ({ ...prev, [nodeId]: false }));
                }
            };
            
            const handleVoltageAdjust = async (nodeId, newVoltage) => {
                const thresholds = nodeThresholds[nodeId];
                if (!thresholds) {
                    alert('Thresholds not loaded yet');
                    return;
                }
                
                if (newVoltage < thresholds.min_voltage_kv || newVoltage > thresholds.hard_max_voltage_kv) {
                    alert(`Voltage must be between ${thresholds.min_voltage_kv} and ${thresholds.hard_max_voltage_kv} kV`);
                    return;
                }
                
                // If above safe threshold, show password modal
                if (newVoltage > thresholds.safe_max_voltage_kv) {
                    setPasswordModal({ 
                        nodeId, 
                        newVoltage, 
                        safeMax: thresholds.safe_max_voltage_kv 
                    });
                    return;
                }
                
                // Otherwise, proceed without password
                await submitVoltageAdjust(nodeId, newVoltage, '');
            };
            
            const submitVoltageAdjust = async (nodeId, newVoltage, password) => {
                try {
                    const res = await fetch(`${API_BASE}/nodes/${nodeId}/voltage`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            voltage_kv: newVoltage, 
                            reason: 'Admin Adjustment',
                            password: password || ''
                        })
                    });
                    const data = await res.json();
                    
                    if (data.status === 'requires_password') {
                        setPasswordModal({
                            nodeId,
                            newVoltage,
                            safeMax: data.threshold
                        });
                        return;
                    }
                    
                    alert(`✅ Voltage adjusted to ${newVoltage} kV`);
                    setPasswordModal(null);
                    setModalPassword('');
                } catch (e) {
                    alert('❌ Failed to adjust voltage: ' + e.message);
                    setPasswordModal(null);
                    setModalPassword('');
                }
            };
            
            const handlePasswordSubmit = async () => {
                if (!passwordModal) return;
                
                await submitVoltageAdjust(passwordModal.nodeId, passwordModal.newVoltage, modalPassword);
            };
            
            return (
                <>
                    {Object.keys(nodeMap).length > 0 && (
                        <div className="node-map">
                            <svg viewBox="0 0 400 400" style={{ border: '1px solid #2a3142', borderRadius: '4px' }}>
                                {/* Grid background */}
                                <defs>
                                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3142" strokeWidth="0.5" opacity="0.3"/>
                                    </pattern>
                                </defs>
                                <rect width="400" height="400" fill="url(#grid)" />
                                
                                {/* Nodes */}
                                {Object.entries(nodeMap).map(([nodeId, location]) => (
                                    <g key={nodeId} className="map-node" onClick={() => console.log(`Clicked: ${nodeId}`)}>
                                        <circle 
                                            cx={location.x} 
                                            cy={location.y} 
                                            r="8"
                                            className={`map-node-circle ${location.state?.toLowerCase() || 'online'}`}
                                        />
                                        <text 
                                            x={location.x} 
                                            y={location.y + 20} 
                                            textAnchor="middle" 
                                            fill="#e0e0e0" 
                                            fontSize="11"
                                            fontFamily="inherit"
                                        >
                                            {location.label}
                                        </text>
                                        <text 
                                            x={location.x} 
                                            y={location.y + 32} 
                                            textAnchor="middle" 
                                            fill="#9ca3af" 
                                            fontSize="9"
                                            fontFamily="inherit"
                                        >
                                            {location.voltage_kv?.toFixed(1)}kV
                                        </text>
                                    </g>
                                ))}
                            </svg>
                        </div>
                    )}
                    
                    <div className="nodes-grid">
                        {nodes.map(node => (
                            <div key={node.node_id} className="node-card">
                                <h3>{node.node_id}</h3>
                                <p>Type: {node.node_type}</p>
                                <p>IP: {node.ip}:{node.rest_port}</p>
                                <p>
                                    Status: <span className={`node-status status-${node.status.toLowerCase()}`}>
                                        {node.status}
                                    </span>
                                </p>
                                {node.latest_telemetry && (
                                    <>
                                        <p>Power: {node.latest_telemetry.active_power_mw?.toFixed(1)} MW</p>
                                        <p>Voltage: {node.latest_telemetry.bus_voltage_kv?.toFixed(2)} kV</p>
                                    </>
                                )}
                                <div className="node-actions">
                                    <button 
                                        className="isolate-btn"
                                        onClick={() => handleIsolateNode(node.node_id)}
                                        disabled={isolateLoading[node.node_id]}
                                    >
                                        {isolateLoading[node.node_id] ? '⏳ ISOLATING...' : '⚠️ ISOLATE'}
                                    </button>
                                    <button 
                                        className="standby-btn"
                                        onClick={() => handleStandbyNode(node.node_id)}
                                        disabled={standbyLoading[node.node_id]}
                                    >
                                        {standbyLoading[node.node_id] ? '⏳...' : '⏸️ STANDBY'}
                                    </button>
                                    <button 
                                        className="start-btn"
                                        onClick={() => handleStartNode(node.node_id)}
                                        disabled={startLoading[node.node_id]}
                                    >
                                        {startLoading[node.node_id] ? '⏳...' : '▶️ START'}
                                    </button>
                                    <div className="voltage-control">
                                        <button 
                                            className="voltage-btn"
                                            onClick={() => {
                                                const current = node.latest_telemetry?.bus_voltage_kv || 0;
                                                handleVoltageAdjust(node.node_id, current - 5);
                                            }}
                                        >
                                            −
                                        </button>
                                        <span className="voltage-display">{node.latest_telemetry?.bus_voltage_kv?.toFixed(1) || '--'} kV</span>
                                        <button 
                                            className="voltage-btn"
                                            onClick={() => {
                                                const current = node.latest_telemetry?.bus_voltage_kv || 0;
                                                handleVoltageAdjust(node.node_id, current + 5);
                                            }}
                                        >
                                            +
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    {passwordModal && (
                        <div className="password-modal">
                            <div className="password-modal-content">
                                <h2>⚠️ Voltage Threshold Override</h2>
                                <p>Requested voltage {passwordModal.newVoltage} kV exceeds safe threshold of {passwordModal.safeMax} kV</p>
                                <p>Enter your password to confirm this action:</p>
                                <input 
                                    type="password" 
                                    placeholder="Password"
                                    value={modalPassword}
                                    onChange={(e) => setModalPassword(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handlePasswordSubmit()}
                                />
                                <div className="password-modal-buttons">
                                    <button 
                                        className="confirm-btn"
                                        onClick={handlePasswordSubmit}
                                    >
                                        CONFIRM
                                    </button>
                                    <button 
                                        className="cancel-btn"
                                        onClick={() => {
                                            setPasswordModal(null);
                                            setModalPassword('');
                                        }}
                                    >
                                        CANCEL
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
