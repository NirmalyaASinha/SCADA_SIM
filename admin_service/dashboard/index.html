        function OverviewTab({ overview, prevOverview, alarms, acknowledgeAlarm }) {
            const [frequencyHistory, setFrequencyHistory] = useState([]);
            const [flashingValues, setFlashingValues] = useState({});
            
            useEffect(() => {
                // Track frequency for sparkline
                if (overview.grid_frequency_hz) {
                    setFrequencyHistory(prev => [...prev.slice(-19), overview.grid_frequency_hz]);
                }
                
                // Detect value changes for flash effect
                const changes = {};
                if (prevOverview.total_generation_mw !== overview.total_generation_mw) changes.generation = true;
                if (prevOverview.total_load_mw !== overview.total_load_mw) changes.load = true;
                if (prevOverview.grid_losses_mw !== overview.grid_losses_mw) changes.losses = true;
                if (prevOverview.nodes_online !== overview.nodes_online) changes.nodes = true;
                
                if (Object.keys(changes).length > 0) {
                    setFlashingValues(changes);
                    setTimeout(() => setFlashingValues({}), 300);
                }
            }, [overview, prevOverview]);
            
            const renderQualityIndicator = (value, min, nominal, max) => {
                if (value < min || value > max) return <span style={{color: 'var(--color-red)'}}>⚠ CRITICAL</span>;
                if (value < nominal || value > nominal * 1.05) return <span style={{color: 'var(--color-amber)'}}>⚠ WARNING</span>;
                return <span style={{color: 'var(--color-green)'}}>✓ GOOD</span>;
            };
            
            const formatTimeAgo = (timestamp) => {
                const seconds = Math.floor((new Date() - new Date(timestamp)) / 1000);
                if (seconds < 60) return `${seconds}s ago`;
                if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
                if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
                return `${Math.floor(seconds / 86400)}d ago`;
            };
            
            return (
                <>
                    <div className="kpi-row">
                        <div className="kpi-card" style={{position: 'relative', overflow: 'hidden'}}>
                            <h3>⚡ TOTAL GENERATION</h3>
                            <div className={`value ${flashingValues.generation ? 'kpi-value-flash' : ''}`}>
                                {overview.total_generation_mw?.toFixed(1) || '0'}
                            </div>
                            <div className="unit">MW</div>
                            <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', marginTop: '0.75rem', paddingTop: '0.75rem', borderTop: '1px solid var(--border-normal)'}}>
                                {renderQualityIndicator(overview.total_generation_mw, 500, 1400, 2000)}
                            </div>
                            <div className="data-freshness-bar"></div>
                        </div>
                        
                        <div className="kpi-card" style={{position: 'relative', overflow: 'hidden'}}>
                            <h3>📊 SYSTEM LOAD</h3>
                            <div className={`value ${flashingValues.load ? 'kpi-value-flash' : ''}`}>
                                {overview.total_load_mw?.toFixed(1) || '0'}
                            </div>
                            <div className="unit">MW</div>
                            <div className="kpi-bar-chart" style={{marginTop: '0.75rem', paddingTop: '0.75rem', borderTop: '1px solid var(--border-normal)'}}>
                                <div className="kpi-bar-item">
                                    <span style={{width: '60px', fontSize: '0.65rem'}}>Gen</span>
                                    <div style={{flex: 1, height: '4px', background: 'rgba(255,255,255,0.1)', borderRadius: '2px', overflow: 'hidden'}}>
                                        <div style={{width: '100%', height: '100%', background: 'var(--color-green)'}}></div>
                                    </div>
                                    <span style={{fontSize: '0.65rem', width: '50px', textAlign: 'right'}}>{overview.total_generation_mw?.toFixed(0)}</span>
                                </div>
                                <div className="kpi-bar-item">
                                    <span style={{width: '60px', fontSize: '0.65rem'}}>Load</span>
                                    <div style={{flex: 1, height: '4px', background: 'rgba(255,255,255,0.1)', borderRadius: '2px', overflow: 'hidden'}}>
                                        <div style={{width: `${overview.total_generation_mw > 0 ? (overview.total_load_mw / overview.total_generation_mw * 100) : 0}%`, height: '100%', background: 'var(--color-amber)'}}></div>
                                    </div>
                                    <span style={{fontSize: '0.65rem', width: '50px', textAlign: 'right'}}>{overview.total_load_mw?.toFixed(0)}</span>
                                </div>
                            </div>
                            <div className="data-freshness-bar"></div>
                        </div>
                        
                        <div className="kpi-card" style={{position: 'relative', overflow: 'hidden', borderColor: overview.grid_frequency_hz < 49.5 || overview.grid_frequency_hz > 50.5 ? 'var(--color-red)' : 'var(--border-normal)'}}>
                            <h3>⚡ GRID FREQUENCY</h3>
                            <div className="value" style={{color: overview.grid_frequency_hz >= 49.8 && overview.grid_frequency_hz <= 50.2 ? 'var(--color-green)' : overview.grid_frequency_hz >= 49.5 && overview.grid_frequency_hz <= 50.5 ? 'var(--color-amber)' : 'var(--color-red)'}}>
                                {overview.grid_frequency_hz?.toFixed(3) || '--'}
                            </div>
                            <div className="unit">Hz</div>
                            {frequencyHistory.length > 5 && (
                                <svg className="kpi-sparkline" viewBox="0 0 100 30" preserveAspectRatio="none" style={{marginTop: '0.5rem'}}>
                                    <polyline
                                        fill="none"
                                        stroke="var(--color-green)"
                                        strokeWidth="1.5"
                                        points={frequencyHistory.map((f, i) => {
                                            const x = (i / (frequencyHistory.length - 1)) * 100;
                                            const y = 30 - ((f - 49) / 2 * 30);
                                            return `${x},${y}`;
                                        }).join(' ')}
                                    />
                                </svg>
                            )}
                            <div className="data-freshness-bar"></div>
                        </div>
                        
                        <div className="kpi-card" style={{position: 'relative', overflow: 'hidden', borderColor: (overview.nodes_online !== overview.nodes_total) ? 'var(--color-red)' : 'var(--border-normal)', animation: (overview.nodes_online !== overview.nodes_total) ? 'pulse 2s ease-in-out infinite' : 'none'}}>
                            <h3>🟢 NODES ONLINE</h3>
                            <div className={`value ${flashingValues.nodes ? 'kpi-value-flash' : ''}`}>
                                {overview.nodes_online || 0}/{overview.nodes_total || 0}
                            </div>
                            <div className="unit">nodes</div>
                            <div style={{fontSize: '0.7rem', color: (overview.nodes_online === overview.nodes_total) ? 'var(--color-green)' : 'var(--color-red)', marginTop: '0.75rem', paddingTop: '0.75rem', borderTop: '1px solid var(--border-normal)'}}>
                                {(overview.nodes_online === overview.nodes_total) ? '✓ All connected' : `⚠ ${overview.nodes_total - overview.nodes_online} offline`}
                            </div>
                            <div className="data-freshness-bar"></div>
                        </div>
                    </div>
                    
                    {/* Alarms Panel */}
                    <div className="alarm-panel">
                        <h3 style={{marginBottom: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                            <span>🚨 ACTIVE ALARMS</span>
                            <span style={{fontSize: '0.8rem', color: 'var(--text-secondary)'}}>
                                {alarms.filter(a => !a.acknowledged).length} unacknowledged
                            </span>
                        </h3>
                        
                        {alarms.length === 0 ? (
                            <div style={{textAlign: 'center', padding: '2rem', color: 'var(--text-secondary)'}}>
                                ✓ No active alarms
                            </div>
                        ) : (
                            alarms.slice(0, 10).map(alarm => {
                                const priorityClass = alarm.priority?.toLowerCase() || 'p5';
                                return (
                                    <div 
                                        key={alarm.id}
                                        className={`alarm-row ${priorityClass} ${alarm.acknowledged ? 'acknowledged' : ''}`}
                                    >
                                        <div style={{display: 'flex', alignItems: 'center', gap: '0.75rem'}}>
                                            <span className="alarm-dot"></span>
                                            <div style={{flex: 1}}>
                                                <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '0.25rem'}}>
                                                    <div style={{fontWeight: 600, fontSize: '0.9rem'}}>
                                                        {alarm.priority} — {alarm.node_id || 'System'}
                                                    </div>
                                                    <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)'}}>
                                                        {formatTimeAgo(alarm.timestamp)}
                                                    </div>
                                                </div>
                                                <div style={{fontSize: '0.85rem', color: 'var(--text-secondary)', marginBottom: '0.5rem'}}>
                                                    {alarm.message}
                                                </div>
                                                {alarm.acknowledged && (
                                                    <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', fontStyle: 'italic'}}>
                                                        Acknowledged by {alarm.acked_by} at {new Date(alarm.acked_at).toLocaleTimeString()}
                                                    </div>
                                                )}
                                            </div>
                                            <div style={{display: 'flex', gap: '0.5rem', alignItems: 'center'}}>
                                                {!alarm.acknowledged && (
                                                    <button 
                                                        className="alarm-ack-btn"
                                                        onClick={() => acknowledgeAlarm(alarm.id)}
                                                    >
                                                        ACK
                                                    </button>
                                                )}
                                                <span className="alarm-mute-icon">🔔</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </>
            );
        }
        
        function NodesTab({ nodes, token }) {
            const [isolateLoading, setIsolateLoading] = useState({});
            const [standbyLoading, setStandbyLoading] = useState({});
            const [startLoading, setStartLoading] = useState({});
            const [nodeMap, setNodeMap] = useState({});
            const [passwordModal, setPasswordModal] = useState(null);
            const [modalPassword, setModalPassword] = useState('');
            const [nodeThresholds, setNodeThresholds] = useState({});
            
            useEffect(() => {
                const fetchNodeMap = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/nodes/map`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        setNodeMap(data);
                    } catch (e) {
                        console.error('Failed to fetch node map:', e);
                    }
                };
                
                const fetchThresholds = async () => {
                    const thresholds = {};
                    for (const node of nodes) {
                        try {
                            const res = await fetch(`${API_BASE}/nodes/${node.node_id}/voltage/threshold`, {
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            const data = await res.json();
                            thresholds[node.node_id] = data;
                        } catch (e) {
                            console.error(`Failed to fetch threshold for ${node.node_id}:`, e);
                        }
                    }
                    setNodeThresholds(thresholds);
                };
                
                // Initial fetch
                fetchNodeMap();
                if (nodes.length > 0) {
                    fetchThresholds();
                }
                
                // Poll node map every 2 seconds for real-time updates
                const mapInterval = setInterval(() => {
                    fetchNodeMap();
                }, 2000);
                
                // Poll thresholds every 5 seconds
                const thresholdInterval = setInterval(() => {
                    if (nodes.length > 0) {
                        fetchThresholds();
                    }
                }, 5000);
                
                // Cleanup intervals
                return () => {
                    clearInterval(mapInterval);
                    clearInterval(thresholdInterval);
                };
            }, [nodes, token]);
            
            const handleIsolateNode = async (nodeId) => {
                if (!window.confirm(`⚠️ CRITICAL: Isolate node ${nodeId}? This will immediately trip all breakers!`)) {
                    return;
                }
                
                setIsolateLoading(prev => ({ ...prev, [nodeId]: true }));
                try {
                    const res = await fetch(`${API_BASE}/nodes/${nodeId}/isolate`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ reason: 'Admin Isolation', force: true })
                    });
                    const data = await res.json();
                    alert(`✅ ${data.message}`);
                } catch (e) {
                    alert('❌ Failed to isolate node: ' + e.message);
                } finally {
                    setIsolateLoading(prev => ({ ...prev, [nodeId]: false }));
                }
            };
            
            const handleStandbyNode = async (nodeId) => {
                if (!window.confirm(`Put node ${nodeId} on standby?`)) {
                    return;
                }
                
                setStandbyLoading(prev => ({ ...prev, [nodeId]: true }));
                try {
                    const res = await fetch(`${API_BASE}/nodes/${nodeId}/standby`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ reason: 'Admin Standby', duration_minutes: 60 })
                    });
                    const data = await res.json();
                    alert(`✅ Node ${nodeId} is now on standby`);
                } catch (e) {
                    alert('❌ Failed to put node on standby: ' + e.message);
                } finally {
                    setStandbyLoading(prev => ({ ...prev, [nodeId]: false }));
                }
            };
            
            const handleStartNode = async (nodeId) => {
                if (!window.confirm(`Start node ${nodeId} from standby?`)) {
                    return;
                }
                
                setStartLoading(prev => ({ ...prev, [nodeId]: true }));
                try {
                    const res = await fetch(`${API_BASE}/nodes/${nodeId}/start`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ reason: 'Admin Start' })
                    });
                    const data = await res.json();
                    alert(`✅ Node ${nodeId} is back online`);
                } catch (e) {
                    alert('❌ Failed to start node: ' + e.message);
                } finally {
                    setStartLoading(prev => ({ ...prev, [nodeId]: false }));
                }
            };
            
            const handleVoltageAdjust = async (nodeId, newVoltage) => {
                const thresholds = nodeThresholds[nodeId];
                if (!thresholds) {
                    alert('Thresholds not loaded yet');
                    return;
                }
                
                if (newVoltage < thresholds.min_voltage_kv || newVoltage > thresholds.hard_max_voltage_kv) {
                    alert(`Voltage must be between ${thresholds.min_voltage_kv} and ${thresholds.hard_max_voltage_kv} kV`);
                    return;
                }
                
                // If above safe threshold, show password modal
                if (newVoltage > thresholds.safe_max_voltage_kv) {
                    setPasswordModal({ 
                        nodeId, 
                        newVoltage, 
                        safeMax: thresholds.safe_max_voltage_kv 
                    });
                    return;
                }
                
                // Otherwise, proceed without password
                await submitVoltageAdjust(nodeId, newVoltage, '');
            };
            
            const submitVoltageAdjust = async (nodeId, newVoltage, password) => {
                try {
                    const res = await fetch(`${API_BASE}/nodes/${nodeId}/voltage`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            voltage_kv: newVoltage, 
                            reason: 'Admin Adjustment',
                            password: password || ''
                        })
                    });
                    const data = await res.json();
                    
                    if (data.status === 'requires_password') {
                        setPasswordModal({
                            nodeId,
                            newVoltage,
                            safeMax: data.threshold
                        });
                        return;
                    }
                    
                    alert(`✅ Voltage adjusted to ${newVoltage} kV`);
                    setPasswordModal(null);
                    setModalPassword('');
                } catch (e) {
                    alert('❌ Failed to adjust voltage: ' + e.message);
                    setPasswordModal(null);
                    setModalPassword('');
                }
            };
            
            const handlePasswordSubmit = async () => {
                if (!passwordModal) return;
                
                await submitVoltageAdjust(passwordModal.nodeId, passwordModal.newVoltage, modalPassword);
            };
            
            // Define grid topology (transmission lines)
            const gridTopology = [
                { from: 'GEN-001', to: 'SUB-001' },
                { from: 'GEN-001', to: 'SUB-002' },
                { from: 'GEN-001', to: 'SUB-003' },
                { from: 'GEN-002', to: 'SUB-001' },
                { from: 'GEN-002', to: 'SUB-002' },
                { from: 'GEN-002', to: 'SUB-003' },
                { from: 'SUB-001', to: 'DIST-001' },
                { from: 'SUB-002', to: 'DIST-002' }
            ];
            
            const isEnergized = (nodeId) => {
                const node = nodeMap[nodeId];
                if (!node) return false;
                const state = (node.state || 'ONLINE').toLowerCase();
                return state === 'online' || state === 'energized' || state === 'normal';
            };
            
            const getNodeLabel = (nodeId, location) => {
                const node = nodes.find(n => n.node_id === nodeId);
                if (!node) return null;
                
                if (node.node_type === 'GENERATION') {
                    return `${node.latest_telemetry?.active_power_mw?.toFixed(0) || 0} MW`;
                } else if (node.node_type === 'TRANSMISSION') {
                    return `${node.latest_telemetry?.bus_voltage_kv?.toFixed(1) || 0} kV`;
                } else if (node.node_type === 'DISTRIBUTION') {
                    const consumers = nodeId === 'DIST-001' ? '45,000' : '38,000';
                    const isLive = isEnergized(nodeId);
                    return isLive ? `${consumers} consumers` : `⚫ NO POWER`;
                }
                return null;
            };
            
            return (
                <>
                    {Object.keys(nodeMap).length > 0 && (
                        <div className="node-map">
                            <svg viewBox="0 0 400 400" style={{ border: '1px solid #2a3142', borderRadius: '4px' }}>
                                {/* Grid background */}
                                <defs>
                                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3142" strokeWidth="0.5" opacity="0.3"/>
                                    </pattern>
                                </defs>
                                <rect width="400" height="400" fill="url(#grid)" />
                                
                                {/* Transmission lines (edges) */}
                                {gridTopology.map((edge, idx) => {
                                    const fromNode = nodeMap[edge.from];
                                    const toNode = nodeMap[edge.to];
                                    if (!fromNode || !toNode) return null;
                                    
                                    const fromEnergized = isEnergized(edge.from);
                                    const toEnergized = isEnergized(edge.to);
                                    const lineEnergized = fromEnergized && toEnergized;
                                    
                                    return (
                                        <line
                                            key={`edge-${idx}`}
                                            x1={fromNode.x}
                                            y1={fromNode.y}
                                            x2={toNode.x}
                                            y2={toNode.y}
                                            className={`map-edge ${lineEnergized ? 'energized' : 'deenergized'}`}
                                        />
                                    );
                                })}
                                
                                {/* Nodes */}
                                {Object.entries(nodeMap).map(([nodeId, location]) => {
                                    const stateColors = {
                                        'online': 'var(--color-green)',
                                        'standby': 'var(--color-amber)',
                                        'offline': 'var(--color-grey)',
                                        'isolated': 'var(--color-purple)',
                                        'tripped': 'var(--color-red)',
                                        'energized': 'var(--color-green)',
                                        'deenergized': 'var(--color-grey)',
                                        'faulted': 'var(--color-red)',
                                        'normal': 'var(--color-green)'
                                    };
                                    const normalizedState = ((location.state || 'ONLINE').toLowerCase());
                                    const stateColor = stateColors[normalizedState] || 'var(--color-grey)';
                                    const nodeEnergized = isEnergized(nodeId);
                                    const additionalLabel = getNodeLabel(nodeId, location);
                                    
                                    return (
                                        <g key={nodeId} className="map-node" onClick={() => console.log(`Clicked: ${nodeId}`)}>
                                            {/* Glow effect for energized nodes */}
                                            {nodeEnergized ? (
                                                <circle 
                                                    cx={location.x} 
                                                    cy={location.y} 
                                                    r="16"
                                                    fill={stateColor}
                                                    opacity="0.1"
                                                    style={{animation: 'pulse 2s infinite'}}
                                                />
                                            ) : null}
                                            
                                            {/* Red X overlay for tripped */}
                                            {normalizedState === 'tripped' && (
                                                <text
                                                    x={location.x}
                                                    y={location.y + 5}

        // ===== ALARMS TAB =====
        function AlarmsTab({ alarms, acknowledgeAlarm }) {
            const [filter, setFilter] = useState('ALL');
            
            const filteredAlarms = alarms.filter(alarm => {
                if (filter === 'ALL') return true;
                if (filter === 'CLEARED') return alarm.acknowledged;
                return alarm.priority === filter;
            });
            
            const stats = {
                total: alarms.length,
                critical: alarms.filter(a => a.priority === 'P1').length,
                high: alarms.filter(a => a.priority === 'P2').length,
                acknowledged: alarms.filter(a => a.acknowledged).length
            };
            
            const formatTimeAgo = (timestamp) => {
                const seconds = Math.floor((Date.now() - new Date(timestamp)) / 1000);
                if (seconds < 60) return `${seconds}s ago`;
                if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
                if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
                return `${Math.floor(seconds / 86400)}d ago`;
            };
            
            return (
                <div style={{padding: '2rem'}}>
                    <h2 style={{marginBottom: '1.5rem', fontSize: '1.5rem'}}>Alarms</h2>
                    
                    <div style={{display: 'flex', gap: '1rem', marginBottom: '2rem'}}>
                        <div style={{flex: 1, padding: '1rem', background: 'var(--bg-card)', borderRadius: '8px', border: '1px solid var(--border-normal)'}}>
                            <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', marginBottom: '0.25rem'}}>TOTAL</div>
                            <div style={{fontSize: '1.8rem', fontWeight: 700, color: 'var(--color-green)'}}>{stats.total}</div>
                        </div>
                        <div style={{flex: 1, padding: '1rem', background: 'var(--bg-card)', borderRadius: '8px', border: '1px solid var(--border-normal)'}}>
                            <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', marginBottom: '0.25rem'}}>CRITICAL</div>
                            <div style={{fontSize: '1.8rem', fontWeight: 700, color: 'var(--color-red)'}}>{stats.critical}</div>
                        </div>
                        <div style={{flex: 1, padding: '1rem', background: 'var(--bg-card)', borderRadius: '8px', border: '1px solid var(--border-normal)'}}>
                            <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', marginBottom: '0.25rem'}}>HIGH</div>
                            <div style={{fontSize: '1.8rem', fontWeight: 700, color: 'var(--color-amber)'}}>{stats.high}</div>
                        </div>
                        <div style={{flex: 1, padding: '1rem', background: 'var(--bg-card)', borderRadius: '8px', border: '1px solid var(--border-normal)'}}>
                            <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', marginBottom: '0.25rem'}}>ACKNOWLEDGED</div>
                            <div style={{fontSize: '1.8rem', fontWeight: 700, color: 'var(--color-green)'}}>{stats.acknowledged}</div>
                        </div>
                    </div>
                    
                    <div style={{display: 'flex', gap: '0.5rem', marginBottom: '1rem'}}>
                        {['ALL', 'P1', 'P2', 'P3', 'CLEARED'].map(f => (
                            <button 
                                key={f}
                                onClick={() => setFilter(f)}
                                style={{padding: '0.5rem 1rem', background: filter === f ? 'var(--color-green)' : 'var(--bg-card)', color: filter === f ? 'var(--bg-void)' : 'var(--text-primary)', border: '1px solid var(--border-normal)', borderRadius: '4px', cursor: 'pointer', fontWeight: 600, fontFamily: 'var(--font-mono)', fontSize: '0.75rem'}}
                            >
                                {f}
                            </button>
                        ))}
                    </div>
                    
                    <div style={{background: 'var(--bg-card)', borderRadius: '8px', border: '1px solid var(--border-normal)', overflow: 'hidden'}}>
                        <div style={{overflowX: 'auto'}}>
                            <table style={{width: '100%', borderCollapse: 'collapse'}}>
                                <thead>
                                    <tr style={{background: 'var(--bg-panel)', borderBottom: '1px solid var(--border-normal)'}}>
                                        <th style={{padding: '0.75rem', textAlign: 'left', fontSize: '0.7rem', color: 'var(--text-secondary)', fontWeight: 700}}>PRIORITY</th>
                                        <th style={{padding: '0.75rem', textAlign: 'left', fontSize: '0.7rem', color: 'var(--text-secondary)', fontWeight: 700}}>NODE</th>
                                        <th style={{padding: '0.75rem', textAlign: 'left', fontSize: '0.7rem', color: 'var(--text-secondary)', fontWeight: 700}}>MESSAGE</th>
                                        <th style={{padding: '0.75rem', textAlign: 'left', fontSize: '0.7rem', color: 'var(--text-secondary)', fontWeight: 700}}>TIME</th>
                                        <th style={{padding: '0.75rem', textAlign: 'center', fontSize: '0.7rem', color: 'var(--text-secondary)', fontWeight: 700}}>ACTION</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredAlarms.map(alarm => (
                                        <tr 
                                            key={alarm.id}
                                            className={alarm.priority === 'P1' && !alarm.acknowledged ? 'alarm-row p1' : ''}
                                            style={{borderBottom: '1px solid var(--border-normal)', textDecoration: alarm.acknowledged ? 'line-through' : 'none', opacity: alarm.acknowledged ? 0.5 : 1}}
                                        >
                                            <td style={{padding: '0.75rem'}}>
                                                <span style={{padding: '0.25rem 0.5rem', borderRadius: '4px', fontSize: '0.7rem', fontWeight: 700, background: alarm.priority === 'P1' ? 'var(--color-red)' : alarm.priority === 'P2' ? 'var(--color-amber)' : 'var(--color-blue)', color: 'white'}}>
                                                    {alarm.priority}
                                                </span>
                                            </td>
                                            <td style={{padding: '0.75rem', fontWeight: 600}}>{alarm.node_id || 'System'}</td>
                                            <td style={{padding: '0.75rem'}}>{alarm.message}</td>
                                            <td style={{padding: '0.75rem', color: 'var(--text-secondary)', fontSize: '0.85rem'}}>{formatTimeAgo(alarm.timestamp)}</td>
                                            <td style={{padding: '0.75rem', textAlign: 'center'}}>
                                                {!alarm.acknowledged && (
                                                    <button 
                                                        onClick={() => acknowledgeAlarm(alarm.id)}
                                                        style={{padding: '0.25rem 0.75rem', background: 'var(--color-green)', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '0.7rem', fontWeight: 600}}
                                                    >
                                                        ACK
                                                    </button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // ===== HISTORIAN TAB =====
        function HistorianTab({ nodes, token }) {
            const [selectedNodes, setSelectedNodes] = useState([]);
            const [selectedMetrics, setSelectedMetrics] = useState([]);
            const [timeRange, setTimeRange] = useState('24H');
            const [chartData, setChartData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            
            const metrics = ['Voltage', 'Current', 'Power', 'Frequency', 'Temperature'];
            const colors = ['#00e676', '#0288d1', '#ffab00', '#ff1744', '#aa44ff'];
            
            // Metric to database column mapping
            const metricDbMap = {
                'Voltage': 'bus_voltage_kv',
                'Current': 'line_current_a',
                'Power': 'active_power_mw',
                'Frequency': 'frequency_hz',
                'Temperature': 'transformer_temp_c'
            };
            
            const handleNodeSelect = (e) => {
                const selected = Array.from(e.target.selectedOptions, option => option.value);
                setSelectedNodes(selected);
            };
            
            const toggleMetric = (metric) => {
                setSelectedMetrics(prev => 
                    prev.includes(metric) 
                        ? prev.filter(m => m !== metric)
                        : [...prev, metric]
                );
            };
            
            const fetchChartData = async () => {
                if (selectedNodes.length === 0 || selectedMetrics.length === 0) {
                    setError('Please select at least one node and one metric');
                    return;
                }
                
                setLoading(true);
                setError(null);
                
                try {
                    const response = await fetch(
                        `${API_BASE}/historian/metrics?nodes=${selectedNodes.join(',')}&metrics=${selectedMetrics.join(',')}&time_range=${timeRange}`,
                        {
                            headers: {
                                'Authorization': `Bearer ${token}`
                            }
                        }
                    );
                    
                    if (!response.ok) throw new Error('Failed to fetch data');
                    
                    const result = await response.json();
                    
                    if (result.error) {
                        setError(result.error);
                        setChartData([]);
                        return;
                    }
                    
                    // Transform data for Recharts
                    const dataByTime = {};
                    result.data.forEach(row => {
                        const timestamp = row.time;
                        if (!dataByTime[timestamp]) {
                            dataByTime[timestamp] = { time: new Date(timestamp).toLocaleTimeString() };
                        }
                        selectedMetrics.forEach(metric => {
                            const column = metricDbMap[metric];
                            const key = `${row.node_id}_${metric}`;
                            dataByTime[timestamp][key] = row[column] || null;
                        });
                    });
                    
                    const transformed = Object.values(dataByTime).sort((a, b) => 
                        new Date(a.time) - new Date(b.time)
                    );
                    
                    setChartData(transformed);
                } catch (err) {
                    setError(err.message);
                    setChartData([]);
                } finally {
                    setLoading(false);
                }
            };
            
            const exportCSV = () => {
                if (chartData.length === 0) {
                    alert('No data to export. Please fetch data first.');
                    return;
                }
                
                try {
                    // Get token for API call
                    const token = localStorage.getItem('token');
                    
                    // Create CSV from raw data
                    let csv = 'timestamp,node_id,metric,value\n';
                    
                    selectedNodes.forEach(nodeId => {
                        selectedMetrics.forEach(metric => {
                            const column = metricDbMap[metric];
                            chartData.forEach(row => {
                                const key = `${nodeId}_${metric}`;
                                const value = row[key];
                                if (value !== null && value !== undefined) {
                                    const timestamp = row.time;
                                    csv += `${timestamp},${nodeId},${metric},${value}\n`;
                                }
                            });
                        });
                    });
                    
                    // Trigger download
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `scada_historian_${new Date().toISOString().split('T')[0]}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } catch (err) {
                    alert('Failed to export CSV: ' + err.message);
                }
            };
            
            // Auto-fetch when selections change
            useEffect(() => {
                if (selectedNodes.length > 0 && selectedMetrics.length > 0) {
                    fetchChartData();
                }
            }, [selectedNodes, selectedMetrics, timeRange]);
            
            return (
                <div style={{padding: '2rem'}}>
                    <h2 style={{marginBottom: '1.5rem', fontSize: '1.5rem'}}>Historian</h2>
                    
                    <div style={{background: 'var(--bg-card)', padding: '2rem', borderRadius: '8px', border: '1px solid var(--border-normal)'}}>
                        <div style={{marginBottom: '2rem'}}>
                            <label style={{display: 'block', marginBottom: '0.5rem', color: 'var(--text-secondary)', fontSize: '0.85rem', fontWeight: 600}}>
                                SELECT NODES ({selectedNodes.length} selected)
                            </label>
                            <select 
                                multiple
                                onChange={handleNodeSelect}
                                value={selectedNodes}
                                style={{width: '100%', padding: '0.75rem', background: 'var(--bg-void)', border: '1px solid var(--border-normal)', color: 'var(--text-primary)', borderRadius: '6px', minHeight: '120px', fontFamily: 'var(--font-mono)', cursor: 'pointer'}}
                            >
                                {nodes.map(node => (
                                    <option key={node.node_id} value={node.node_id}>{node.node_id} ({node.node_type})</option>
                                ))}
                            </select>
                            <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', marginTop: '0.25rem'}}>Hold Ctrl/Cmd to select multiple</div>
                        </div>
                        
                        <div style={{marginBottom: '2rem'}}>
                            <label style={{display: 'block', marginBottom: '0.5rem', color: 'var(--text-secondary)', fontSize: '0.85rem', fontWeight: 600}}>
                                SELECT METRICS ({selectedMetrics.length} selected)
                            </label>
                            <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
                                {metrics.map(metric => (
                                    <button 
                                        key={metric}
                                        onClick={() => toggleMetric(metric)}
                                        style={{
                                            padding: '0.5rem 1rem',
                                            background: selectedMetrics.includes(metric) ? 'var(--color-green)' : 'var(--bg-void)',
                                            border: '1px solid ' + (selectedMetrics.includes(metric) ? 'var(--color-green)' : 'var(--border-normal)'),
                                            color: selectedMetrics.includes(metric) ? 'var(--bg-void)' : 'var(--text-primary)',
                                            borderRadius: '4px',
                                            cursor: 'pointer',
                                            fontSize: '0.85rem',
                                            fontWeight: selectedMetrics.includes(metric) ? 600 : 400,
                                            transition: 'all 0.2s'
                                        }}
                                    >
                                        {metric}
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        <div style={{marginBottom: '2rem'}}>
                            <label style={{display: 'block', marginBottom: '0.5rem', color: 'var(--text-secondary)', fontSize: '0.85rem', fontWeight: 600}}>
                                TIME RANGE
                            </label>
                            <div style={{display: 'flex', gap: '0.5rem'}}>
                                {['15m', '1H', '6H', '24H', '7D'].map(range => (
                                    <button 
                                        key={range}

                                            fontSize: '0.85rem',

                                        {range}
                                    </button>
                                ))}
                            </div>
                        </div>
                        
                        {error && (
                            <div style={{background: 'rgba(255, 23, 68, 0.1)', border: '1px solid var(--color-red)', color: 'var(--color-red)', padding: '0.75rem', borderRadius: '4px', marginBottom: '2rem', fontSize: '0.85rem'}}>
                                ⚠️ {error}

                        )}
                        
                        {loading && (
                            <div style={{background: 'var(--bg-panel)', padding: '4rem 2rem', borderRadius: '6px', textAlign: 'center', color: 'var(--text-secondary)', marginBottom: '2rem'}}>
                                <div style={{fontSize: '1.5rem', marginBottom: '0.5rem'}}>⏳</div>
                                Fetching data...
                            </div>
                        )}
                        
                        {!loading && chartData.length > 0 && (
                            <div style={{background: 'var(--bg-panel)', padding: '2rem', borderRadius: '6px', marginBottom: '2rem', overflowX: 'auto'}}>
                                <div id="chart-container" style={{width: '100%', height: '400px'}}>
                                    {selectedNodes.length > 0 && selectedMetrics.length > 0 && (
                                        <svg viewBox="0 0 900 400" style={{width: '100%', height: '100%', background: 'var(--bg-panel)'}}>
                                            {/* Render simple line chart */}
                                            <defs>
                                                {selectedNodes.map((node, nodeIdx) => 
                                                    colors.map((_, metricIdx) => (
                                                        <linearGradient key={node + metricIdx} id={`grad_${nodeIdx}_${metricIdx}`} x1="0%" y1="0%" x2="0%" y2="100%">

                                            {/* Grid lines */}

                                            ))}
                                            
                                            {/* Plot lines for each selected node-metric combination */}
                                            {selectedNodes.length > 0 && selectedMetrics.map((metric, metricIdx) => {
                                                const points = [];
                                                const maxValue = Math.max(...chartData.map((row, idx) => row[`${selectedNodes[0]}_${metric}`] || 0), 1);
                                                
                                                chartData.forEach((row, idx) => {
                                                    const x = 50 + (idx / (chartData.length - 1 || 1)) * 800;
                                                    const value = row[`${selectedNodes[0]}_${metric}`];
                                                    if (value !== null && value !== undefined) {
                                                        const y = 350 - (value / maxValue) * 300;
                                                        points.push(`${x},${y}`);
                                                    }
                                                });
                                                
                                                return (
                                                    <polyline 
                                                        key={metric}
                                                        points={points.join(' ')}
                                                        fill="none"
                                                        stroke={colors[metricIdx]}
                                                        strokeWidth="2"
                                                    />
                                                );
                                            })}
                                            
                                            {/* Axis labels */}
                                            <text x="20" y="360" fontSize="12" fill="var(--text-secondary)">0</text>
                                            <text x="20" y="200" fontSize="12" fill="var(--text-secondary)">50%</text>
                                            <text x="870" y="370" fontSize="12" fill="var(--text-secondary)" textAnchor="end">Now</text>
                                        </svg>
                                    )}
                                </div>
                                
                                {/* Legend */}
                                <div style={{marginTop: '1rem', display: 'flex', gap: '2rem', flexWrap: 'wrap', fontSize: '0.85rem'}}>
                                    {selectedMetrics.map((metric, idx) => (

                                            <span style={{color: 'var(--text-secondary)'}}>{metric} ({chartData.length} points)</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        
                        {!loading && chartData.length === 0 && selectedNodes.length > 0 && selectedMetrics.length > 0 && (
                            <div style={{background: 'var(--bg-panel)', padding: '4rem 2rem', borderRadius: '6px', textAlign: 'center', color: 'var(--text-secondary)', marginBottom: '2rem'}}>
                                <div style={{fontSize: '1.5rem', marginBottom: '0.5rem'}}>📊</div>
