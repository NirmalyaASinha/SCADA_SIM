<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADA Admin - Operations Control Centre</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            background: #0a0e1a;
            color: #e0e0e0;
        }
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
        }
        .login-card {
            background: #151a26;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid #2a3142;
            min-width: 450px;
        }
        .login-card h1 {
            color: #4ade80;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            font-weight: 700;
        }
        .login-card .subtitle {
            color: #9ca3af;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        input {
            width: 100%;
            padding: 0.875rem;
            margin-bottom: 1rem;
            background: #0a0e1a;
            border: 1px solid #2a3142;
            color: #e0e0e0;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 0.875rem;
            background: #4ade80;
            color: #0a0e1a;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
        }
        button:hover { background: #22c55e; }
        .dashboard {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #151a26;
            border-right: 2px solid #2a3142;
            padding: 1.5rem 0;
        }
        .sidebar h2 {
            color: #4ade80;
            font-size: 1.2rem;
            padding: 0 1.5rem;
            margin-bottom: 2rem;
        }
        .nav-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            color: #9ca3af;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            background: #0a0e1a;
            color: #4ade80;
        }
        .nav-item.active {
            background: #0a0e1a;
            color: #4ade80;
            border-left-color: #4ade80;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
        }
        .header {
            background: #151a26;
            padding: 1rem 2rem;
            border-bottom: 2px solid #4ade80;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #4ade80;
            font-size: 1.3rem;
        }
        .frequency {
            font-size: 2.2rem;
            font-weight: 700;
            color: #4ade80;
        }
        .content {
            padding: 2rem;
        }
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .kpi-card {
            background: #151a26;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #2a3142;
        }
        .kpi-card h3 {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .kpi-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #4ade80;
        }
        .kpi-card .unit {
            color: #6b7280;
            font-size: 0.9rem;
        }
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        .node-card {
            background: #151a26;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #2a3142;
        }
        .node-card h3 {
            color: #4ade80;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .node-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-online { background: #065f46; color: #4ade80; }
        .status-offline { background: #7f1d1d; color: #ef4444; }
        .error { color: #ef4444; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const API_BASE = 'http://localhost:9000';
        
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [token, setToken] = useState(null);
            const [user, setUser] = useState({});
            const [error, setError] = useState('');
            
            const handleLogin = async (username, password) => {
                try {
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        setToken(data.token);
                        setUser({ username: data.username, role: data.role });
                        setIsAuthenticated(true);
                        setError('');
                    } else {
                        setError(data.error || 'Login failed');
                    }
                } catch (e) {
                    setError('Connection error');
                }
            };
            
            if (!isAuthenticated) {
                return <LoginScreen onLogin={handleLogin} error={error} />;
            }
            
            return <Dashboard token={token} user={user} />;
        }
        
        function LoginScreen({ onLogin, error }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            
            return (
                <div className="login-screen">
                    <div className="login-card">
                        <h1>SCADA ADMIN</h1>
                        <div className="subtitle">Operations Control Centre</div>
                        <input 
                            type="text" 
                            placeholder="Username"
                            value={username}
                            onChange={e => setUsername(e.target.value)}
                        />
                        <input 
                            type="password" 
                            placeholder="Password"
                            value={password}
                            onChange={e => setPassword(e.target.value)}
                            onKeyPress={e => e.key === 'Enter' && onLogin(username, password)}
                        />
                        <button onClick={() => onLogin(username, password)}>LOGIN</button>
                        {error && <div className="error">{error}</div>}
                    </div>
                </div>
            );
        }
        
        function Dashboard({ token, user }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [overview, setOverview] = useState({});
            const [nodes, setNodes] = useState([]);
            
            useEffect(() => {
                const fetchOverview = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/grid/overview`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        setOverview(data);
                    } catch (e) {
                        console.error('Failed to fetch overview:', e);
                    }
                };
                
                const fetchNodes = async () => {
                    try {
                        const res = await fetch(`${API_BASE}/nodes`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        setNodes(data);
                    } catch (e) {
                        console.error('Failed to fetch nodes:', e);
                    }
                };
                
                fetchOverview();
                fetchNodes();
                
                const interval = setInterval(() => {
                    fetchOverview();
                    fetchNodes();
                }, 3000);
                
                return () => clearInterval(interval);
            }, [token]);
            
            return (
                <div className="dashboard">
                    <div className="sidebar">
                        <h2>SCADA OCC</h2>
                        <div 
                            className={`nav-item ${activeTab === 'overview' ? 'active' : ''}`}
                            onClick={() => setActiveTab('overview')}
                        >
                            Grid Overview
                        </div>
                        <div 
                            className={`nav-item ${activeTab === 'nodes' ? 'active' : ''}`}
                            onClick={() => setActiveTab('nodes')}
                        >
                            Node Management
                        </div>
                    </div>
                    
                    <div className="main-content">
                        <div className="header">
                            <h1>GRID OVERVIEW</h1>
                            <div className="frequency">
                                {overview.grid_frequency_hz?.toFixed(3) || '--'} Hz
                            </div>
                        </div>
                        
                        <div className="content">
                            {activeTab === 'overview' && <OverviewTab overview={overview} />}
                            {activeTab === 'nodes' && <NodesTab nodes={nodes} token={token} />}
                        </div>
                    </div>
                </div>
            );
        }
        
        function OverviewTab({ overview }) {
            return (
                <>
                    <div className="kpi-row">
                        <div className="kpi-card">
                            <h3>TOTAL GENERATION</h3>
                            <div className="value">{overview.total_generation_mw?.toFixed(1) || '0'}</div>
                            <div className="unit">MW</div>
                        </div>
                        
                        <div className="kpi-card">
                            <h3>TOTAL LOAD</h3>
                            <div className="value">{overview.total_load_mw?.toFixed(1) || '0'}</div>
                            <div className="unit">MW</div>
                        </div>
                        
                        <div className="kpi-card">
                            <h3>GRID LOSSES</h3>
                            <div className="value">{overview.grid_losses_mw?.toFixed(1) || '0'}</div>
                            <div className="unit">MW ({overview.loss_percentage?.toFixed(1) || '0'}%)</div>
                        </div>
                        
                        <div className="kpi-card">
                            <h3>NODES ONLINE</h3>
                            <div className="value">{overview.nodes_online || 0}/{overview.nodes_total || 0}</div>
                            <div className="unit">nodes</div>
                        </div>
                    </div>
                </>
            );
        }
        
        function NodesTab({ nodes, token }) {
            return (
                <div className="nodes-grid">
                    {nodes.map(node => (
                        <div key={node.node_id} className="node-card">
                            <h3>{node.node_id}</h3>
                            <p>Type: {node.node_type}</p>
                            <p>IP: {node.ip}:{node.rest_port}</p>
                            <p>
                                Status: <span className={`node-status status-${node.status.toLowerCase()}`}>
                                    {node.status}
                                </span>
                            </p>
                            {node.latest_telemetry && (
                                <>
                                    <p>Power: {node.latest_telemetry.active_power_mw?.toFixed(1)} MW</p>
                                    <p>Voltage: {node.latest_telemetry.bus_voltage_kv?.toFixed(2)} kV</p>
                                </>
                            )}
                        </div>
                    ))}
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
